<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Project: Brain</title>
<meta name="description" content="Project: Brain turns a chaotic head into a calm map. One tiny move at a time.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
<meta property="og:title" content="Project: Brain">
<meta property="og:description" content="Untangle your mind, one small move at a time.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brain">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#fff;--ink:#0d0d0d;--mute:#8a8a90;--line:rgba(0,0,0,.13);--sheet:#fff;--shadow:rgba(0,0,0,.10);--scrim:rgba(255,255,255,.55)}
:root[data-theme=dark]{--bg:#0b0b0c;--ink:#f4f4f5;--mute:#8d8d94;--line:rgba(255,255,255,.16);--sheet:#141416;--shadow:rgba(0,0,0,.6);--scrim:rgba(0,0,0,.45)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);transition:background .7s ease,color .7s ease;
  font-family:-apple-system,BlinkMacSystemFont,"Inter","SF Arabic","Segoe UI","Noto Sans Arabic",Tahoma,"Helvetica Neue",Arial,sans-serif;font-weight:300;letter-spacing:.01em}
html[dir=rtl] *{letter-spacing:0!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--mute);outline-offset:3px}
#app{position:fixed;inset:0;margin:0 auto;max-width:520px;overflow:hidden}

#top{position:absolute;top:0;left:0;right:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;z-index:30}
#top .l,#top .r{flex:1;display:flex;align-items:center}
#top .r{justify-content:flex-end;gap:8px}
#brand{white-space:nowrap;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);transition:opacity .6s}
#back{font-size:13px;color:var(--mute);opacity:0;pointer-events:none;transition:opacity .6s;position:absolute;inset-inline-start:20px}
html[dir=rtl] .chev{display:inline-block;transform:scaleX(-1)}
#meter{opacity:0;transition:opacity .8s;text-align:center;min-width:120px}
#meter .t{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
#meter .t b{font-weight:400;color:var(--ink)}
#meter .bar{height:1px;background:var(--line);margin-top:7px;position:relative}
#meter .bar i{position:absolute;inset-inline-start:0;top:-.5px;height:2px;background:var(--ink);width:0;transition:width 1.6s cubic-bezier(.22,.8,.2,1)}
.rb{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:border-color .6s;flex:none}
.rb svg{width:15px;height:15px}
#profBtn svg{width:18px;height:auto}
body[data-view=map] #brand{opacity:0}
body[data-view=map] #back{opacity:1;pointer-events:auto}
body[data-view=map] #meter{opacity:1}

#home{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .9s ease}
#brainBtn{display:block;width:min(74vw,300px);transition:transform 1.1s cubic-bezier(.5,0,.2,1),opacity .9s ease;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#brainBtn .float{animation:float 6.5s ease-in-out infinite;perspective:800px}
#brain3d{position:relative;transform-style:preserve-3d;will-change:transform}
#brain3d .layer{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#brain3d .layer svg{width:100%;height:auto;display:block}
#brain3d .front svg{width:100%;height:auto;display:block;filter:drop-shadow(0 18px 22px rgba(238,138,163,.25))}
.shadow{width:120px;height:10px;border-radius:50%;background:var(--ink);opacity:.07;filter:blur(8px);margin-top:26px;animation:shadow 6.5s ease-in-out infinite}
#hint{margin-top:30px;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--mute);animation:breathe 5s ease-in-out infinite}
#homeToday{margin-top:22px;height:48px;padding:0 34px;font-size:15px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes shadow{0%,100%{transform:scale(1);opacity:.08}50%{transform:scale(.8);opacity:.04}}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:.85}}
body[data-view=map] #home{opacity:0;pointer-events:none}
body[data-view=map] #brainBtn{transform:scale(2.6)}

#map{position:absolute;inset:0;opacity:0;pointer-events:none;transform:scale(.94);direction:ltr;transition:opacity 1s ease .35s,transform 1.2s cubic-bezier(.2,.8,.2,1) .2s}
body[data-view=map] #map{opacity:1;pointer-events:auto;transform:scale(1)}
#map svg{width:100%;height:100%;display:block;touch-action:none}
#mapGroup{transform-origin:0 0}
#mapGroup.pulse{animation:pulse 1.6s ease-in-out}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.025)}100%{transform:scale(1)}}
.node{cursor:grab}
.node.held{cursor:grabbing}
.node .dot{transition:r .6s,fill .6s,opacity .6s,stroke .6s}
.node text{font-size:11px;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round;transition:opacity .8s;pointer-events:none}
.node.sel .dot,.node.sel text,.node.held text,.node.held .dot{opacity:1!important}
.edge{fill:none;stroke:var(--ink);stroke-linecap:round}
#veil{position:absolute;inset:0;z-index:15;pointer-events:none;opacity:0;transition:opacity .7s ease;
  -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);background:rgba(255,255,255,.2);
  -webkit-mask-image:radial-gradient(circle at var(--fx,50%) var(--fy,24%),transparent 62px,#000 190px);mask-image:radial-gradient(circle at var(--fx,50%) var(--fy,24%),transparent 62px,#000 190px)}
:root[data-theme=dark] #veil{background:rgba(0,0,0,.28)}
#veil.on{opacity:1}
#insight{position:absolute;left:28px;right:28px;top:78px;text-align:center;font-size:13px;line-height:1.6;color:var(--mute);min-height:40px;transition:opacity .7s}
#bottom{position:absolute;left:0;right:0;bottom:0;padding:0 20px calc(26px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;z-index:20;opacity:0;transition:opacity .9s ease .5s;pointer-events:none}
body[data-view=map] #bottom{opacity:1;pointer-events:auto}
.pill{height:44px;padding:0 22px;border-radius:22px;border:1px solid var(--line);font-size:14px;display:flex;align-items:center;gap:8px;transition:all .4s;background:var(--bg)}
.pill.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill:active{transform:scale(.97)}
.pill .n{font-size:12px;opacity:.7}

#replayBar{position:absolute;left:0;right:0;bottom:0;padding:0 28px calc(26px + env(safe-area-inset-bottom));z-index:25;opacity:0;pointer-events:none;transition:opacity .8s}
body[data-replay=on] #replayBar{opacity:1;pointer-events:auto}
body[data-replay=on] #bottom,body[data-replay=on] #insight{opacity:0;pointer-events:none}
body[data-replay=on] .node{pointer-events:none}
#replayBar .rp{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-bottom:10px}
#replayBar .bar{height:1px;background:var(--line);position:relative;margin-bottom:22px}
#replayBar .bar i{position:absolute;inset-inline-start:0;top:-.5px;height:2px;background:var(--ink);width:0}
.row{display:flex;gap:10px}
#replayBar .row{justify-content:center}

#scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .7s,background .5s;z-index:65}
#scrim.on{opacity:1;pointer-events:auto}
#scrim.lite{background:transparent}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:70;background:var(--sheet);border-radius:26px 26px 0 0;box-shadow:0 -20px 60px var(--shadow);padding:10px 26px calc(28px + env(safe-area-inset-bottom));
  transform:translateY(106%);opacity:0;transition:transform .8s cubic-bezier(.22,.8,.2,1),opacity .6s ease;max-height:86%;overflow:auto;overscroll-behavior:contain}
#goalSheet{max-height:64%}
.sheet.open{transform:translateY(0);opacity:1}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 22px}
.xbtn{position:sticky;top:6px;float:right;z-index:4;width:34px;height:34px;margin:0 0 0 10px;border-radius:50%;border:1px solid var(--line);background:var(--sheet);display:grid;place-items:center;font-size:14px;color:var(--mute)}
html[dir=rtl] .xbtn{float:left;margin:0 10px 0 0}
.tag{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.sheet h2{font-size:26px;font-weight:300;margin:8px 0 18px;letter-spacing:0}
.prog{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--mute);margin-bottom:22px}
.prog span{direction:ltr}
.prog .bar{flex:1;height:1px;background:var(--line);position:relative}
.prog .bar i{position:absolute;inset-inline-start:0;top:-.5px;height:2px;background:var(--ink);transition:width 1.2s cubic-bezier(.22,.8,.2,1)}
.move,.track{border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;margin-bottom:16px}
.move .lbl{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-bottom:10px}
.move .txt{font-size:17px;line-height:1.5;margin-bottom:14px}
.move .two{font-size:12px;color:var(--mute)}
.move .small{font-size:12px;color:var(--mute);margin-top:12px;text-decoration:underline;text-underline-offset:3px}
.trow{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.lnk{font-size:12px;color:var(--mute);text-decoration:underline;text-underline-offset:3px}
.big{font-size:32px;line-height:1.1;font-weight:300}.big small{font-size:14px;color:var(--mute)}
.sub{font-size:12px;color:var(--mute);margin:4px 0 12px}
.spark{color:var(--ink);margin:4px 0 2px}.spark svg{width:100%;height:34px;display:block}
.logrow{display:flex;gap:10px;margin-top:14px}
.in{height:44px;border:1px solid var(--line);border-radius:14px;background:none;color:var(--ink);font:inherit;font-size:16px;padding:0 14px;width:100%;outline:none;transition:border-color .4s}
.in:focus{border-color:var(--mute)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g2 .full{grid-column:1/-1}
.btn{height:46px;border-radius:23px;width:100%;background:var(--ink);color:var(--bg);font-size:15px;transition:opacity .4s,transform .3s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.3;pointer-events:none}
.logrow .btn{width:auto;padding:0 22px;flex:none}
.next{font-size:13px;color:var(--mute);line-height:1.9;margin:4px 0 18px}
.next .phh{font-size:11px;letter-spacing:.18em;text-transform:uppercase;margin:14px 0 2px;color:var(--mute)}
.next div.s{display:flex;gap:10px}.next div.s:before{content:"";width:5px;height:5px;border-radius:50%;border:1px solid var(--mute);margin-top:9px;flex:none}
.next div.d{opacity:.5;text-decoration:line-through}.next div.d:before{background:var(--mute)}
.next div.cur{color:var(--ink)}.next div.cur:before{border-color:var(--ink);background:var(--ink)}
.note{font-size:13px;color:var(--mute);line-height:1.6;margin:0 0 20px}
.tl{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);width:100%;text-align:start;transition:opacity .6s}
.tl:last-of-type{border-bottom:0}
.chk{width:26px;height:26px;border-radius:50%;border:1px solid var(--mute);flex:none;display:grid;place-items:center;transition:all .5s}
.chk svg{width:13px;height:13px;opacity:0;transition:opacity .5s}
.tl.done{opacity:.4}.tl.done .chk{background:var(--ink);border-color:var(--ink)}.tl.done .chk svg{opacity:1;stroke:var(--bg)}
.tl .g{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
.tl .s{font-size:16px;line-height:1.4}
textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:16px;background:none;color:var(--ink);font:inherit;font-size:17px;padding:14px 16px;resize:none;outline:none;margin-bottom:14px;transition:border-color .4s}
textarea:focus{border-color:var(--mute)}
.mic{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none;transition:all .4s}
.mic svg{width:18px;height:18px}
.mic.on{background:var(--ink);color:var(--bg);animation:breathe 1.6s ease-in-out infinite}
#toast{position:absolute;left:50%;bottom:96px;transform:translate(-50%,10px);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:22px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .6s,transform .6s;z-index:130;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translate(-50%,0)}

#profile{position:absolute;inset:0;z-index:60;background:var(--bg);opacity:0;pointer-events:none;transform:translateY(24px);transition:opacity .7s ease,transform .8s cubic-bezier(.22,.8,.2,1),background .7s;overflow:auto}
#profile.open{opacity:1;pointer-events:auto;transform:none}
.pbar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;background:var(--bg);z-index:2}
.pbody{padding:0 26px 60px}
.tabs{width:100%;margin:2px 0 22px}.tabs button{flex:1;padding:9px 6px}
.idc{text-align:center;padding:0 0 14px}
.avatar{width:72px;height:72px;border-radius:50%;border:1px solid var(--line);margin:0 auto 12px;display:grid;place-items:center;overflow:hidden}
.avatar svg{width:50px;height:auto}
.avatar svg.sym,.avb svg.sym{width:34px;height:34px}
.name{background:none;border:0;outline:0;text-align:center;font:inherit;font-size:21px;color:var(--ink);width:80%}
.name::placeholder{color:var(--mute)}
.avgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:0 0 24px}
.avb{aspect-ratio:1;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;transition:all .4s}
.avb svg{width:26px;height:auto}.avb svg.sym{width:20px;height:20px}
.avb.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0;margin-bottom:22px;text-align:center}
.stats b{display:block;font-weight:300;font-size:18px}.stats span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 14px}
.sec h3{margin:0;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);font-weight:400}.sec span{font-size:12px;color:var(--mute)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 8px;margin-bottom:26px}
.bd{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center}
.bd .ic{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;opacity:.3;transition:all .6s}
.bd.on .ic{opacity:1;border-color:var(--ink)}
.bd svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.bd span{font-size:10.5px;color:var(--mute);line-height:1.3}.bd.on span{color:var(--ink)}
.pat{font-size:14px;color:var(--mute);line-height:1.7;margin:0 0 24px}.pat div{padding:6px 0}
.rw{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px solid var(--line);width:100%;font-size:16px;text-align:start}
.rw .ar{color:var(--mute);font-size:18px}html[dir=rtl] .rw .ar{transform:scaleX(-1)}
.seg{display:flex;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.seg button{padding:6px 14px;font-size:13px;color:var(--mute);transition:all .4s}.seg button.on{background:var(--ink);color:var(--bg)}
.rv3{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;margin:4px 0 22px}
.rv3 b{display:block;font-weight:300;font-size:30px}.rv3 span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.mail{color:var(--ink);text-decoration:underline;text-underline-offset:3px}

#gate{position:absolute;inset:0;z-index:120;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;padding:0 34px;text-align:center;direction:ltr;transition:opacity .9s ease}
#gate.show{display:flex}#gate.gone{opacity:0;pointer-events:none}
#gate .gb{width:150px;margin-bottom:26px;animation:float 6.5s ease-in-out infinite}#gate .gb svg{width:100%;height:auto;display:block}
#gate h1{margin:0 0 10px;font-weight:300;font-size:13px;letter-spacing:.34em;text-transform:uppercase}
#gate p{margin:0 0 36px;font-size:14px;color:var(--mute)}
.gbtn{width:100%;max-width:300px;height:54px;border-radius:27px;border:1px solid var(--line);font-size:18px;margin-bottom:12px;transition:all .4s}
.gbtn:active{transform:scale(.97);background:var(--ink);color:var(--bg)}

#splash{position:absolute;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1.1s ease}
#splash.gone{opacity:0;pointer-events:none}
#pc{position:absolute;inset:0;width:100%;height:100%;transition:opacity 2.2s ease}
#pc.off{opacity:0}
#spBrain{position:relative;width:min(60vw,250px);opacity:0;transition:opacity 2.2s ease;margin-top:-30px}
#spBrain.on{opacity:1}
#spBrain.float{animation:float 6.5s ease-in-out infinite}
#spBrain svg{width:100%;height:auto;display:block;filter:drop-shadow(0 18px 22px rgba(238,138,163,.25))}
.sp-title{position:relative;text-align:center;opacity:0;transition:opacity 1.6s ease;margin-top:30px;padding:0 30px}
.sp-title h1{margin:0 0 8px;font-weight:300;font-size:13px;letter-spacing:.34em;text-transform:uppercase}
.sp-title p{margin:0;font-size:14px;color:var(--mute);line-height:1.6}
.sp-intro{position:relative;text-align:center;margin-top:26px;padding:0 34px;max-width:430px}
.sp-intro p{margin:0 0 12px;font-size:18px;line-height:1.45;font-weight:300;opacity:0;transform:translateY(6px);transition:opacity 1.4s ease,transform 1.4s ease}
.sp-intro p:first-child{font-size:24px;margin-bottom:14px}
.sp-intro p.on{opacity:1;transform:none}
.sp-btn{position:relative;margin-top:26px;height:48px;padding:0 44px;border-radius:24px;background:var(--ink);color:var(--bg);font-size:15px;opacity:0;pointer-events:none;transition:opacity 1.6s ease,transform .3s}
.sp-title.on,.sp-btn.on{opacity:1}.sp-btn.on{pointer-events:auto}
.sp-btn:active{transform:scale(.97)}
#spLang{position:absolute;top:18px;inset-inline-end:20px;width:auto;padding:0 14px;border-radius:17px;font-size:13px;color:var(--mute);z-index:2}
#spVer{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom));font-size:11px;letter-spacing:.2em;color:var(--mute);opacity:.6}

#onboard{position:absolute;inset:0;z-index:80;background:var(--bg);display:none;flex-direction:column;opacity:0;transition:opacity .9s ease}
#onboard.show{display:flex}#onboard.on{opacity:1}
.ob-top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex:none}
.ob-top .sp{width:34px}
#obBack{font-size:22px;color:var(--mute);width:34px;height:34px}
.dots{display:flex;gap:7px}.dots i{width:5px;height:5px;border-radius:50%;background:var(--line);transition:background .6s}.dots i.on{background:var(--ink)}
#obBody{flex:1;overflow:auto;padding:6px 26px 0;transition:opacity .45s ease}
#obFoot{padding:12px 26px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;flex:none}
.ob h1{font-size:30px;font-weight:300;line-height:1.25;margin:16px 0 12px;letter-spacing:0}
.ob p{font-size:15px;color:var(--mute);line-height:1.6;margin:0 0 22px}
.ob .fine{font-size:12px;margin-top:18px}
.opt{display:block;width:100%;text-align:start;padding:17px 18px;border:1px solid var(--line);border-radius:18px;font-size:16px;line-height:1.4;margin-bottom:10px;transition:all .45s}
.opt.sel{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.opt small{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.6;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.chip{border:1px solid var(--line);border-radius:18px;padding:8px 14px;font-size:13px;color:var(--mute);transition:all .4s}.chip.on{border-color:var(--ink);color:var(--ink)}
.cnt{font-size:11px;color:var(--mute);letter-spacing:.16em;text-transform:uppercase;margin:0 0 12px;min-height:14px}

const VERSION='1.1.0';
const KEY='projectBrain.state';
const DEV_EMAIL='hello.verseapps@gmail.com'; // "Message the developer" opens the user's email app to this address

const $=s=>document.querySelector(s);
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t*t*(3-2*t);
const hash=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return (h>>>0)/4294967295};
const rnd=(id,k)=>hash(id+k);
const mem={};
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return mem[k]??null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){mem[k]=v}},del(k){try{localStorage.removeItem(k)}catch(e){delete mem[k]}}};
/* open the app with ?reset to start as a brand-new user */
if(/[?&]reset(?:[=&]|$)/.test(location.search)){['projectBrain.state','projectBrain.lang','projectBrain.langSet'].forEach(k=>store.del(k));try{history.replaceState(null,'',location.pathname)}catch(e){}}
const dayKey=()=>new Date().toLocaleDateString('en-CA');
const fmt=n=>Number(n).toLocaleString('en-US',{maximumFractionDigits:1});
const D=864e5;
const f1=n=>n.toFixed(1);
const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const noDia=x=>x.replace(/[ً-ْـ]/g,'');

/* ---------- brain art ---------- */
let bid=0;
function bez(p,closed){const n=p.length;let d=`M${f1(p[0][0])},${f1(p[0][1])}`;const m=closed?n:n-1;
  for(let i=0;i<m;i++){const g=k=>closed?p[(k+n)%n]:p[clamp(k,0,n-1)];const a=g(i-1),b=g(i),c=g(i+1),e=g(i+2);
    d+=`C${f1(b[0]+(c[0]-a[0])/6)},${f1(b[1]+(c[1]-a[1])/6)} ${f1(c[0]-(e[0]-b[0])/6)},${f1(c[1]-(e[1]-b[1])/6)} ${f1(c[0])},${f1(c[1])}`}
  return d+(closed?'Z':'')}
function prng(seed){let x=seed;return()=>{x=(x*1664525+1013904223)%4294967296;return x/4294967296}}
const OUT=[[22,92],[13,72],[20,48],[40,28],[68,15],[100,10],[134,14],[162,28],[182,48],[187,72],[180,94],[164,106],[142,108],[124,112],[112,127],[92,133],[72,127],[58,113],[40,109],[28,102]];
function sample(pts,seg){const out=[],n=pts.length;for(let i=0;i<n;i++){const a=pts[(i-1+n)%n],b=pts[i],c=pts[(i+1)%n],d=pts[(i+2)%n];
  for(let t=0;t<seg;t++){const u=t/seg,u2=u*u,u3=u2*u;const f=k=>.5*(2*b[k]+(-a[k]+c[k])*u+(2*a[k]-5*b[k]+4*c[k]-d[k])*u2+(-a[k]+3*b[k]-3*c[k]+d[k])*u3);out.push([f(0),f(1)])}}return out}
function brainOutline(){const cx=100,cy=72;return sample(OUT,5).filter((_,i)=>i%2===0).map(([x,y])=>{const a=Math.atan2(y-cy,x-cx),k=1+.028*Math.sin(a*9+1)+.02*Math.sin(a*15+2);return [cx+(x-cx)*k,cy+(y-cy)*k]})}
const CERP=()=>bez(sample([[128,112],[140,106],[160,106],[176,112],[172,124],[154,130],[136,126]],4).filter((_,i)=>i%2===0),true);
let _body=null,_cer=null;const BODY=()=>_body||(_body=bez(brainOutline(),true)),CER=()=>_cer||(_cer=CERP());
function brainSVG(ghost,shine){
  const id='b'+(++bid),body=BODY(),cer=CER();
  const R=prng(11);let folds='';
  for(let k=0;k<38;k++){let x=20+R()*165,y=12+R()*108,a=R()*6.28;const pts=[[x,y]],sg=4+Math.floor(R()*4);
    for(let q=0;q<sg;q++){a+=(R()-.5)*2.5;const l=8+R()*9;x+=Math.cos(a)*l;y+=Math.sin(a)*l;pts.push([x,y])}folds+=`<path d="${bez(pts,false)}"/>`}
  const syl='<path d="M62,100 C86,96 106,88 130,66" stroke-width="2.4" opacity=".85"/><path d="M100,14 C96,40 112,56 104,84" stroke-width="2" opacity=".7"/>';
  const col=ghost?'currentColor':'#D45E7E';
  if(ghost)return `<svg viewBox="0 0 200 160"><defs><clipPath id="${id}c"><path d="${body}"/></clipPath></defs>
   <path d="${body}" fill="none" stroke="#E7A0B4" stroke-width="1.1"/>
   <g clip-path="url(#${id}c)" fill="none" stroke="#E7A0B4" stroke-width=".7" stroke-linecap="round" opacity=".3">${folds}${syl.replace(/stroke-width="[\d.]+"/g,'stroke-width="1"')}</g></svg>`;
  const sh=shine?`<radialGradient id="${id}s" cx=".35" cy=".28" r=".65"><stop offset="0" stop-color="#fff" stop-opacity=".62"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
   <linearGradient id="${id}d" x1="0" y1=".45" x2="0" y2="1"><stop offset="0" stop-color="#7a1f3a" stop-opacity="0"/><stop offset="1" stop-color="#7a1f3a" stop-opacity=".2"/></linearGradient>`:'';
  const shp=shine?`<path d="${body}" fill="url(#${id}d)"/><path d="${body}" fill="url(#${id}s)"/>`:'';
  return `<svg viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F9C2CE"/><stop offset="1" stop-color="#EC859F"/></linearGradient>
  <linearGradient id="${id}h" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EE90A8"/><stop offset="1" stop-color="#DC6A8A"/></linearGradient>${sh}
  <clipPath id="${id}c"><path d="${body}"/></clipPath></defs>
  <path d="M109,118 L124,118 L128,150 Q118,157 108,150 Z" fill="url(#${id}h)" stroke="${col}" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="${cer}" fill="url(#${id}h)" stroke="${col}" stroke-width="1.8"/>
  <path d="${body}" fill="url(#${id}g)"/>${shp}
  <g clip-path="url(#${id}c)" fill="none" stroke="${col}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".5">${folds}</g>
  <g clip-path="url(#${id}c)" fill="none" stroke="${col}" stroke-linecap="round" opacity=".9">${syl}</g>
  <path d="${body}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round"/>
  </svg>`}

  const q=(a,b,c)=>{const mx=(a.x+b.x)/2,my=(a.y+b.y)/2,dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy)||1;return `M${a.x.toFixed(1)},${a.y.toFixed(1)}Q${(mx-dy/l*c).toFixed(1)},${(my+dx/l*c).toFixed(1)} ${b.x.toFixed(1)},${b.y.toFixed(1)}`};

  tangles.forEach(t=>{t.e.setAttribute('d',q(t.a,t.b,70*Math.sin(ts*.0004+t.k)*chaos));t.e.style.opacity=.4*Math.pow(chaos,1.3);t.e.style.strokeWidth=.8});
  edgeEls.deps.forEach(d=>{const o=(nodeOrder(d.a.g)+nodeOrder(d.b.g))/2;d.e.setAttribute('d',q(d.a,d.b,46*(1-o)*Math.sin(ts*.0005+d.a.px)));d.e.style.opacity=.32+.25*o;d.e.style.strokeWidth=1});
  const zero={x:0,y:0};
  nodes.forEach((n,i)=>{const o=nodeOrder(n.g);edgeEls.spokes[i].setAttribute('d',q(zero,n,0));edgeEls.spokes[i].style.opacity=.18*Math.pow(o,3);edgeEls.spokes[i].style.strokeWidth=.7});
  const rc=$('#ringC'),core=$('#core');if(rc){rc.setAttribute('opacity',.45*Math.pow(go,2.2));core.setAttribute('opacity',Math.pow(go,2))}
  requestAnimationFrame(frame);
}

/* ---------- local "AI" (rule-based; real AI later) ---------- */
function insight(){
  if(!S.goals.length)return T('insEmpty');
  const open=S.goals.filter(g=>!fin(g));
  if(!open.length)return T('insDone');
  let best=null,bn=0;open.forEach(g=>{const n=open.filter(o=>o.deps.includes(g.id)).length;if(n>bn){bn=n;best=g}});
  if(best&&bn>=2)return T('insUnlock',gt(best),bn,best.active);
  const c=calm();return c<25?T('insEarly'):c<60?T('insMid'):T('insLate');
}
function patterns(){
  const ev=events();if(ev.length<4)return [];const out=[],now=Date.now();
  const byDay=Array(7).fill(0);ev.forEach(e=>byDay[new Date(e.at).getDay()]++);
  const bi=byDay.indexOf(Math.max(...byDay));out.push(T('patDay',dayName(bi),Math.round(byDay[bi]/ev.length*100)));
  const tb={morning:0,afternoon:0,evening:0,night:0};ev.forEach(e=>{const h=new Date(e.at).getHours();tb[h>=5&&h<12?'morning':h>=12&&h<18?'afternoon':h>=18&&h<23?'evening':'night']++});
  const tk=Object.keys(tb).sort((a,b)=>tb[b]-tb[a])[0];if(tb[tk]/ev.length>=.4)out.push(T('patTime',T('tm_'+tk)));
  const a=ev.filter(e=>e.at>now-7*D).length,b=ev.filter(e=>e.at<=now-7*D&&e.at>now-14*D).length;if(a||b)out.push(T('patWeek',a,b));
  return out;
}

  S.todayDone=(S.todayDone||[]).filter(x=>x.d===new Date().toDateString());S.todayDone.push({id:gid,i,d:new Date().toDateString()});

function spark(m){
  const pts=[m.start,...m.log.map(l=>l.v)];if(pts.length<2)return '';
  const lo=Math.min(...pts,m.target),hi=Math.max(...pts,m.target),sp=(hi-lo)||1,W=300,H=34;
  const xy=pts.map((v,i)=>[i/(pts.length-1)*W,H-3-((v-lo)/sp)*(H-6)]);
  const ty=H-3-((m.target-lo)/sp)*(H-6);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line x1="0" x2="${W}" y1="${ty}" y2="${ty}" stroke="currentColor" stroke-width=".6" stroke-dasharray="2 4" opacity=".5"/><polyline points="${xy.map(p=>p.map(f1).join(',')).join(' ')}" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;
}

/* ---------- splash: dots gather into the brain, then the intro ---------- */
const SP={done:false,fast:null};
function runSplash(){
  const first=!S.onboarded,speed=first?1:1.6,cv=$('#pc'),reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  $('#spBrain').innerHTML=brainSVG(false);
  const lines=()=>[...document.querySelectorAll('#spIntro p')];
  const reveal=()=>{
    if(first){const ps=lines();ps.forEach((p,i)=>setTimeout(()=>p.classList.add('on'),i*1700));setTimeout(()=>$('#spBtn').classList.add('on'),ps.length*1700+400);
      SP.fast=()=>{ps.forEach(p=>p.classList.add('on'));$('#spBtn').classList.add('on')}}
    else{$('#spTitle').classList.add('on');$('#spBtn').classList.add('on')}
  };
  const show=()=>{SP.done=true;$('#spBrain').classList.add('on','float');cv.classList.add('off');
    if(first){lines().forEach(p=>p.classList.add('on'))}else $('#spTitle').classList.add('on');$('#spBtn').classList.add('on')};
  SP.skip=show;
  if(reduce){setTimeout(show,300);return}
  const dpr=Math.min(window.devicePixelRatio||1,2),cr=cv.getBoundingClientRect(),W=cr.width,H=cr.height;
  cv.width=W*dpr;cv.height=H*dpr;const cx=cv.getContext('2d');cx.scale(dpr,dpr);
  const br=$('#spBrain').getBoundingClientRect(),sc=br.width/200,ox=br.left-cr.left,oy=br.top-cr.top;
  const poly=brainOutline();
  const inside=(x,y)=>{let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])c=!c}return c};
  const N=window.innerWidth<500?260:340,tg=[];
  while(tg.length<N){const x=12+Math.random()*176,y=8+Math.random()*128;if(inside(x,y))tg.push([x,y])}
  for(let i=0;i<70;i++){const p=poly[Math.floor(i*poly.length/70)];tg.push([p[0],p[1]])}
  const cols=['#F2A0B5','#EC859F','#F9C2CE','#E7A0B4','#F5B3C3'],ink=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#111';
  const P=tg.map(([x,y],i)=>({tx:ox+x*sc,ty:oy+y*sc,sx:Math.random()*W,sy:Math.random()*H,d:Math.random()*1.9,du:2.3+Math.random()*1.3,r:.9+Math.random()*1.6,c:i%9===0?ink:cols[i%cols.length],al:i%9===0?.3:1,sw:(Math.random()-.5)*190,ph:Math.random()*9}));
  const t0=performance.now();let b1=0,b2=0,b3=0;
  (function step(now){
    const t=(now-t0)/1000*speed;cx.clearRect(0,0,W,H);
    for(const p of P){
      const e=clamp((t-p.d)/p.du,0,1),k=e<.5?4*e*e*e:1-Math.pow(-2*e+2,3)/2,sw=Math.sin(Math.PI*k)*p.sw;
      const x=lerp(p.sx,p.tx,k)+sw*.7+Math.sin(now/900+p.ph)*(1-k)*7,y=lerp(p.sy,p.ty,k)+sw*.35+Math.cos(now/1100+p.ph)*(1-k)*7;
      cx.globalAlpha=p.al*(.14+.8*Math.min(1,e*1.7));cx.fillStyle=p.c;cx.beginPath();cx.arc(x,y,p.r,0,6.283);cx.fill();
    }
    if(t>3.5&&!b1){b1=1;$('#spBrain').classList.add('on')}
    if(t>4.0&&!b2){b2=1;cv.classList.add('off')}
    if(t>5.0&&!b3){b3=1;SP.done=true;reveal();$('#spBrain').classList.add('float')}
    if(t<9)requestAnimationFrame(step);else cx.clearRect(0,0,W,H);
  })(t0);
}
$('#splash').addEventListener('click',()=>{if(!SP.done&&SP.skip)SP.skip();else if(SP.fast)SP.fast()});

/* ---------- guided tour ---------- */
const TOUR={i:0,on:false,iv:0};
const arect=e=>{const a=e.getBoundingClientRect(),p=$('#app').getBoundingClientRect();return {x:a.left-p.left,y:a.top-p.top,w:a.width,h:a.height}};
function tourRect(i){
  const pad=(r,p)=>({x:r.x-p,y:r.y-p,w:r.w+2*p,h:r.h+2*p});
  if(i===0&&nodes.length){const rs=nodes.map(n=>arect(n.dot));const x0=Math.min(...rs.map(r=>r.x)),y0=Math.min(...rs.map(r=>r.y)),x1=Math.max(...rs.map(r=>r.x+r.w)),y1=Math.max(...rs.map(r=>r.y+r.h));return {...pad({x:x0,y:y0,w:x1-x0,h:y1-y0},40),rad:'28px'}}
  if(i===1&&nodes.length){const n=nodes.find(n=>n.g.active)||nodes[0];return {...pad(arect(n.dot),26),rad:'50%'}}
  if(i===2)return {...pad(arect($('#meter')),12),rad:'16px'};
  if(i===3)return {...pad(arect($('#todayBtn')),6),rad:'28px'};
  if(i===4)return {...pad(arect($('#addBtn')),6),rad:'28px'};
  if(i===5)return {...pad(arect($('#profBtn')),6),rad:'50%'};
  const a=$('#app').getBoundingClientRect();return {x:a.width/2-1,y:a.height*.4,w:2,h:2,rad:'50%'};
}
function renderTour(){
  const i=TOUR.i,steps=T('tour'),cur=steps[i],r=tourRect(i),H=$('#app').getBoundingClientRect().height;
  const h=$('#hole');h.style.cssText=`left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;border-radius:${r.rad}`;
  const tc=$('#tcard'),low=(r.y+r.h/2)>H*.5;
  tc.innerHTML=`<h3>${cur.t}</h3><p>${cur.b}</p><div class="tfoot"><div class="dots">${steps.map((_,k)=>`<i class="${k<=i?'on':''}"></i>`).join('')}</div><div style="display:flex;gap:14px;align-items:center">${i<steps.length-1?`<button class="lnk" id="tSkip">${T('skip')}</button>`:''}<button class="btn" id="tNext">${i<steps.length-1?T('tourNext'):T('tourGo')}</button></div></div>`;
  tc.style.top=low?'86px':'auto';tc.style.bottom=low?'auto':'26px';
  $('#tNext').onclick=()=>{if(TOUR.i<steps.length-1){TOUR.i++;renderTour()}else endTour()};
  const sk=$('#tSkip');if(sk)sk.onclick=endTour;
  if(i===2)pulse();
  clearInterval(TOUR.iv);if(i<2)TOUR.iv=setInterval(()=>{const q=tourRect(TOUR.i),h2=$('#hole');h2.style.left=q.x+'px';h2.style.top=q.y+'px';h2.style.width=q.w+'px';h2.style.height=q.h+'px'},180);
}
function startTour(){TOUR.i=0;TOUR.on=true;$('#tour').classList.add('on');renderTour()}
function endTour(){TOUR.on=false;clearInterval(TOUR.iv);$('#tour').classList.remove('on');S.toured=true;save()}

/* ---------- boot ---------- */
applyLang();requestAnimationFrame(frame);
if(!S.onboarded&&!store.get('projectBrain.langSet'))showGate();else runSplash();
if(/[?&]demo/.test(location.search))window.__demo={
  progress(f){const all=[];S.goals.forEach(g=>g.steps.forEach((x,i)=>all.push([g,x,i])));const n=Math.round(all.length*f),now=Date.now(),ev=k=>{const d=new Date(now-k*D);d.setHours(20,10);return d.getTime()};
    all.forEach(([g,x],k)=>{x.done=k<n;if(x.done)x.at=ev((k*5)%8);else delete x.at});
    S.goals.forEach(g=>{if(g.metric){const m=g.metric,sp=m.target-m.start;m.cur=m.start+sp*f*.8;m.log=[.2,.45,.8].map((y,j)=>({d:'',v:m.start+sp*f*y,at:ev(6-j*2)}))}});
    S.days=[0,1,2,3,4,5,6].map(k=>new Date(now-k*D).toLocaleDateString('en-CA'));S.flags=Object.assign(S.flags,{dumped:1,parked:1,measured:1});save();checkBadges(true);paint()},
  age(id,days){const g=G(id);g.since=Date.now()-days*D;g.touches=[];g.steps.forEach(x=>{if(x.at)x.at=Math.min(x.at,Date.now()-days*D)});g.metric&&g.metric.log.forEach(l=>l.at=Date.now()-days*D);save()},
  open:openGoal,focus:focusGoal,today:openToday,view,theme:setTheme,profile:openProfile,review:openReview,replay:startReplay,endReplay,lang:setLang,tour:startTour,calm,state:()=>S};
</script>
