<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Project: Brain</title>
<meta name="description" content="Project: Brain turns a chaotic head into a calm map. One tiny move at a time.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
<meta property="og:title" content="Project: Brain">
<meta property="og:description" content="Untangle your mind, one small move at a time.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brain">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#fff;--ink:#0d0d0d;--mute:#8a8a90;--line:rgba(0,0,0,.13);--sheet:#fff;--shadow:rgba(0,0,0,.10);--scrim:rgba(255,255,255,.55)}
:root[data-theme=dark]{--bg:#0b0b0c;--ink:#f4f4f5;--mute:#8d8d94;--line:rgba(255,255,255,.16);--sheet:#141416;--shadow:rgba(0,0,0,.6);--scrim:rgba(0,0,0,.45)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);transition:background .7s ease,color .7s ease;
  font-family:-apple-system,BlinkMacSystemFont,"Inter","SF Arabic","Segoe UI","Noto Sans Arabic",Tahoma,"Helvetica Neue",Arial,sans-serif;font-weight:300;letter-spacing:.01em}
html[dir=rtl] *{letter-spacing:0!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--mute);outline-offset:3px}
#app{position:fixed;inset:0;margin:0 auto;max-width:520px;overflow:hidden}

#top{position:absolute;top:0;left:0;right:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;z-index:30}
#top .l,#top .r{flex:1;display:flex;align-items:center}
#top .r{justify-content:flex-end;gap:8px}
#brand{white-space:nowrap;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);transition:opacity .6s}
#back{font-size:13px;color:var(--mute);opacity:0;pointer-events:none;transition:opacity .6s;position:absolute;inset-inline-start:20px}
html[dir=rtl] .chev{display:inline-block;transform:scaleX(-1)}
#meter{opacity:0;transition:opacity .8s;text-align:center;min-width:120px}
#meter .t{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
#meter .t b{font-weight:400;color:var(--ink)}
#meter .bar{height:1px;background:var(--line);margin-top:7px;position:relative}
#meter .bar i{position:absolute;inset-inline-start:0;top:-.5px;height:2px;background:var(--ink);width:0;transition:width 1.6s cubic-bezier(.22,.8,.2,1)}
.rb{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:border-color .6s;flex:none}
.rb svg{width:15px;height:15px}
#profBtn svg{width:18px;height:auto}
body[data-view=map] #brand{opacity:0}
body[data-view=map] #back{opacity:1;pointer-events:auto}
body[data-view=map] #meter{opacity:1}

#home{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .9s ease}
#brainBtn{display:block;width:min(74vw,300px);transition:transform 1.1s cubic-bezier(.5,0,.2,1),opacity .9s ease;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#brainBtn .float{animation:float 6.5s ease-in-out infinite;perspective:800px}
#brain3d{position:relative;transform-style:preserve-3d;will-change:transform}
#brain3d .layer{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#brain3d .layer svg{width:100%;height:auto;display:block}
#brain3d .front svg{width:100%;height:auto;display:block;filter:drop-shadow(0 18px 22px rgba(238,138,163,.25))}
.shadow{width:120px;height:10px;border-radius:50%;background:var(--ink);opacity:.07;filter:blur(8px);margin-top:26px;animation:shadow 6.5s ease-in-out infinite}
#hint{margin-top:30px;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--mute);animation:breathe 5s ease-in-out infinite}
#homeToday{margin-top:22px;height:48px;padding:0 34px;font-size:15px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes shadow{0%,100%{transform:scale(1);opacity:.08}50%{transform:scale(.8);opacity:.04}}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:.85}}
body[data-view=map] #home{opacity:0;pointer-events:none}
body[data-view=map] #brainBtn{transform:scale(2.6)}

#map{position:absolute;inset:0;opacity:0;pointer-events:none;transform:scale(.94);direction:ltr;transition:opacity 1s ease .35s,transform 1.2s cubic-bezier(.2,.8,.2,1) .2s}
body[data-view=map] #map{opacity:1;pointer-events:auto;transform:scale(1)}
#map svg{width:100%;height:100%;display:block;touch-action:none}
#mapGroup{transform-origin:0 0}
#mapGroup.pulse{animation:pulse 1.6s ease-in-out}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.025)}100%{transform:scale(1)}}
.node{cursor:grab}
.node.held{cursor:grabbing}
.node .dot{transition:r .6s,fill .6s,opacity .6s,stroke .6s}
.node text{font-size:11px;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round;transition:opacity .8s;pointer-events:none}
.node.sel .dot,.node.held text,.node.held .dot{opacity:1!important}
.node.sel text,#map.foc .node text{opacity:0!important;transition:opacity .25s}
.edge{fill:none;stroke:var(--ink);stroke-linecap:round}
#veil{position:absolute;inset:0;z-index:15;pointer-events:none;opacity:0;transition:opacity .7s ease;
  -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);background:rgba(255,255,255,.2);
  -webkit-mask-image:radial-gradient(circle at var(--fx,50%) var(--fy,24%),transparent 62px,#000 190px);mask-image:radial-gradient(circle at var(--fx,50%) var(--fy,24%),transparent 62px,#000 190px)}
:root[data-theme=dark] #veil{background:rgba(0,0,0,.28)}
#veil.on{opacity:1}
#insight{position:absolute;left:28px;right:28px;top:78px;text-align:center;font-size:13px;line-height:1.6;color:var(--mute);min-height:40px;transition:opacity .7s}
#bottom{position:absolute;left:0;right:0;bottom:0;padding:0 20px calc(26px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;z-index:20;opacity:0;transition:opacity .9s ease .5s;pointer-events:none}
body[data-view=map] #bottom{opacity:1;pointer-events:auto}
.pill{height:44px;padding:0 22px;border-radius:22px;border:1px solid var(--line);font-size:14px;display:flex;align-items:center;gap:8px;transition:all .4s;background:var(--bg)}
.pill.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill:active{transform:scale(.97)}
.pill .n{font-size:12px;opacity:.7}

#replayBar{position:absolute;left:0;right:0;bottom:0;padding:0 28px calc(26px + env(safe-area-inset-bottom));z-index:25;opacity:0;pointer-events:none;transition:opacity .8s}
body[data-replay=on] #replayBar{opacity:1;pointer-events:auto}
body[data-replay=on] #bottom,body[data-replay=on] #insight{opacity:0;pointer-events:none}
body[data-replay=on] .node{pointer-events:none}
#replayBar .rp{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-bottom:10px}
#replayBar .bar{height:1px;background:var(--line);position:relative;margin-bottom:22px}
#replayBar .bar i{position:absolute;inset-inline-start:0;top:-.5px;height:2px;background:var(--ink);width:0}
.row{display:flex;gap:10px}
#replayBar .row{justify-content:center}

#scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .7s,background .5s;z-index:65}
#scrim.on{opacity:1;pointer-events:auto}
#scrim.lite{background:transparent}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:70;background:var(--sheet);border-radius:26px 26px 0 0;box-shadow:0 -20px 60px var(--shadow);padding:10px 26px calc(28px + env(safe-area-inset-bottom));
  transform:translateY(106%);opacity:0;transition:transform .8s cubic-bezier(.22,.8,.2,1),opacity .6s ease;max-height:86%;overflow:auto;overscroll-behavior:contain}
#goalSheet{max-height:64%}
.sheet.open{transform:translateY(0);opacity:1}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 22px}
.xbtn{position:sticky;top:6px;float:right;z-index:4;width:34px;height:34px;margin:0 0 0 10px;border-radius:50%;border:1px solid var(--line);background:var(--sheet);display:grid;place-items:center;font-size:14px;color:var(--mute)}
html[dir=rtl] .xbtn{float:left;margin:0 10px 0 0}
.tag{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.sheet h2{font-size:26px;font-weight:300;margin:8px 0 18px;letter-spacing:0}
.prog{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--mute);margin-bottom:22px}
.prog span{direction:ltr}
.prog .bar{flex:1;height:1px;background:var(--line);position:relative}
.prog .bar i{position:absolute;inset-inline-start:0;top:-.5px;height:2px;background:var(--ink);transition:width 1.2s cubic-bezier(.22,.8,.2,1)}
.move,.track{border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;margin-bottom:16px}
.move .lbl{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-bottom:10px}
.move .txt{font-size:17px;line-height:1.5;margin-bottom:14px}
.move .two{font-size:12px;color:var(--mute)}
.move .small{font-size:12px;color:var(--mute);margin-top:12px;text-decoration:underline;text-underline-offset:3px}
.trow{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.lnk{font-size:12px;color:var(--mute);text-decoration:underline;text-underline-offset:3px}
.big{font-size:32px;line-height:1.1;font-weight:300}.big small{font-size:14px;color:var(--mute)}
.sub{font-size:12px;color:var(--mute);margin:4px 0 12px}
.spark{color:var(--ink);margin:4px 0 2px}.spark svg{width:100%;height:34px;display:block}
.logrow{display:flex;gap:10px;margin-top:14px}
.in{height:44px;border:1px solid var(--line);border-radius:14px;background:none;color:var(--ink);font:inherit;font-size:16px;padding:0 14px;width:100%;outline:none;transition:border-color .4s}
.in:focus{border-color:var(--mute)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g2 .full{grid-column:1/-1}
.btn{height:46px;border-radius:23px;width:100%;background:var(--ink);color:var(--bg);font-size:15px;transition:opacity .4s,transform .3s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.3;pointer-events:none}
.logrow .btn{width:auto;padding:0 22px;flex:none}
.next{font-size:13px;color:var(--mute);line-height:1.9;margin:4px 0 18px}
.next .phh{font-size:11px;letter-spacing:.18em;text-transform:uppercase;margin:14px 0 2px;color:var(--mute)}
.next div.s{display:flex;gap:10px}.next div.s:before{content:"";width:5px;height:5px;border-radius:50%;border:1px solid var(--mute);margin-top:9px;flex:none}
.next div.d{opacity:.5;text-decoration:line-through}.next div.d:before{background:var(--mute)}
.next div.cur{color:var(--ink)}.next div.cur:before{border-color:var(--ink);background:var(--ink)}
.note{font-size:13px;color:var(--mute);line-height:1.6;margin:0 0 20px}
.tl{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);width:100%;text-align:start;transition:opacity .6s}
.tl:last-of-type{border-bottom:0}
.chk{width:26px;height:26px;border-radius:50%;border:1px solid var(--mute);flex:none;display:grid;place-items:center;transition:all .5s}
.chk svg{width:13px;height:13px;opacity:0;transition:opacity .5s}
.tl.done{opacity:.4}.tl.done .chk{background:var(--ink);border-color:var(--ink)}.tl.done .chk svg{opacity:1;stroke:var(--bg)}
.tl .g{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
.tl .s{font-size:16px;line-height:1.4}
textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:16px;background:none;color:var(--ink);font:inherit;font-size:17px;padding:14px 16px;resize:none;outline:none;margin-bottom:14px;transition:border-color .4s}
textarea:focus{border-color:var(--mute)}
.mic{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none;transition:all .4s}
.mic svg{width:18px;height:18px}
.mic.on{background:var(--ink);color:var(--bg);animation:breathe 1.6s ease-in-out infinite}
#toast{position:absolute;left:50%;bottom:96px;transform:translate(-50%,10px);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:22px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .6s,transform .6s;z-index:130;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translate(-50%,0)}

#profile{position:absolute;inset:0;z-index:60;background:var(--bg);opacity:0;pointer-events:none;transform:translateY(24px);transition:opacity .7s ease,transform .8s cubic-bezier(.22,.8,.2,1),background .7s;overflow:auto}
#profile.open{opacity:1;pointer-events:auto;transform:none}
.pbar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;background:var(--bg);z-index:2}
.pbody{padding:0 26px 60px}
.tabs{width:100%;margin:2px 0 22px}.tabs button{flex:1;padding:9px 6px}
.idc{text-align:center;padding:0 0 14px}
.avatar{width:72px;height:72px;border-radius:50%;border:1px solid var(--line);margin:0 auto 12px;display:grid;place-items:center;overflow:hidden}
.avatar svg{width:50px;height:auto}
.avatar svg.sym,.avb svg.sym{width:34px;height:34px}
.name{background:none;border:0;outline:0;text-align:center;font:inherit;font-size:21px;color:var(--ink);width:80%}
.name::placeholder{color:var(--mute)}
.avgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:0 0 24px}
.avb{aspect-ratio:1;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;transition:all .4s}
.avb svg{width:26px;height:auto}.avb svg.sym{width:20px;height:20px}
.avb.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0;margin-bottom:22px;text-align:center}
.stats b{display:block;font-weight:300;font-size:18px}.stats span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.flowrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:14px 0 4px;font-size:12px}
.flowrow span{border:1px solid var(--line);border-radius:999px;padding:6px 11px}
.flowrow i{color:var(--mute);font-style:normal}
[dir=rtl] .flowrow i{display:inline-block;transform:scaleX(-1)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 14px}
.sec h3{margin:0;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);font-weight:400}.sec span{font-size:12px;color:var(--mute)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 8px;margin-bottom:26px}
.bd{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center}
.bd .ic{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;opacity:.3;transition:all .6s}
.bd.on .ic{opacity:1;border-color:var(--ink)}
.bd svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.bd span{font-size:10.5px;color:var(--mute);line-height:1.3}.bd.on span{color:var(--ink)}
.pat{font-size:14px;color:var(--mute);line-height:1.7;margin:0 0 24px}.pat div{padding:6px 0}
.rw{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px solid var(--line);width:100%;font-size:16px;text-align:start}
.rw .ar{color:var(--mute);font-size:18px}html[dir=rtl] .rw .ar{transform:scaleX(-1)}
.seg{display:flex;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.seg button{padding:6px 14px;font-size:13px;color:var(--mute);transition:all .4s}.seg button.on{background:var(--ink);color:var(--bg)}
.rv3{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;margin:4px 0 22px}
.rv3 b{display:block;font-weight:300;font-size:30px}.rv3 span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.mail{color:var(--ink);text-decoration:underline;text-underline-offset:3px}

#gate{position:absolute;inset:0;z-index:120;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;padding:0 34px;text-align:center;direction:ltr;transition:opacity .9s ease}
#gate.show{display:flex}#gate.gone{opacity:0;pointer-events:none}
#gate .gb{width:150px;margin-bottom:26px;animation:float 6.5s ease-in-out infinite}#gate .gb svg{width:100%;height:auto;display:block}
#gate h1{margin:0 0 10px;font-weight:300;font-size:13px;letter-spacing:.34em;text-transform:uppercase}
#gate p{margin:0 0 36px;font-size:14px;color:var(--mute)}
.gbtn{width:100%;max-width:300px;height:54px;border-radius:27px;border:1px solid var(--line);font-size:18px;margin-bottom:12px;transition:all .4s}
.gbtn:active{transform:scale(.97);background:var(--ink);color:var(--bg)}

#splash{position:absolute;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1.1s ease}
#splash.gone{opacity:0;pointer-events:none}
#pc{position:absolute;inset:0;width:100%;height:100%;transition:opacity 2.2s ease}
#pc.off{opacity:0}
#spBrain{position:relative;width:min(60vw,250px);opacity:0;transition:opacity 2.2s ease;margin-top:-30px}
#spBrain.on{opacity:1}
#spBrain.float{animation:float 6.5s ease-in-out infinite}
#spBrain svg{width:100%;height:auto;display:block;filter:drop-shadow(0 18px 22px rgba(238,138,163,.25))}
.sp-title{position:relative;text-align:center;opacity:0;transition:opacity 1.6s ease;margin-top:30px;padding:0 30px}
.sp-title h1{margin:0 0 8px;font-weight:300;font-size:13px;letter-spacing:.34em;text-transform:uppercase}
.sp-title p{margin:0;font-size:14px;color:var(--mute);line-height:1.6}
.sp-intro{position:relative;text-align:center;margin-top:26px;padding:0 34px;max-width:430px}
.sp-intro p{margin:0 0 12px;font-size:18px;line-height:1.45;font-weight:300;opacity:0;transform:translateY(6px);transition:opacity 1.4s ease,transform 1.4s ease}
.sp-intro p:first-child{font-size:24px;margin-bottom:14px}
.sp-intro p.on{opacity:1;transform:none}
.sp-btn{position:relative;margin-top:26px;height:48px;padding:0 44px;border-radius:24px;background:var(--ink);color:var(--bg);font-size:15px;opacity:0;pointer-events:none;transition:opacity 1.6s ease,transform .3s}
.sp-title.on,.sp-btn.on{opacity:1}.sp-btn.on{pointer-events:auto}
.sp-btn:active{transform:scale(.97)}
#spLang{position:absolute;top:18px;inset-inline-end:20px;width:auto;padding:0 14px;border-radius:17px;font-size:13px;color:var(--mute);z-index:2}
#spVer{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom));font-size:11px;letter-spacing:.2em;color:var(--mute);opacity:.6}

#onboard{position:absolute;inset:0;z-index:80;background:var(--bg);display:none;flex-direction:column;opacity:0;transition:opacity .9s ease}
#onboard.show{display:flex}#onboard.on{opacity:1}
.ob-top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex:none}
.ob-top .sp{width:34px}
#obBack{font-size:22px;color:var(--mute);width:34px;height:34px}
.dots{display:flex;gap:7px}.dots i{width:5px;height:5px;border-radius:50%;background:var(--line);transition:background .6s}.dots i.on{background:var(--ink)}
#obBody{flex:1;overflow:auto;padding:6px 26px 0;transition:opacity .45s ease}
#obFoot{padding:12px 26px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;flex:none}
.ob h1{font-size:30px;font-weight:300;line-height:1.25;margin:16px 0 12px;letter-spacing:0}
.ob p{font-size:15px;color:var(--mute);line-height:1.6;margin:0 0 22px}
.ob .fine{font-size:12px;margin-top:18px}
.opt{display:block;width:100%;text-align:start;padding:17px 18px;border:1px solid var(--line);border-radius:18px;font-size:16px;line-height:1.4;margin-bottom:10px;transition:all .45s}
.opt.sel{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.opt small{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.6;margin-top:6px}

function bez(p,closed){const n=p.length;let d=`M${f1(p[0][0])},${f1(p[0][1])}`;const m=closed?n:n-1;

  return d+(closed?'Z':'')}

  for(let t=0;t<seg;t++){const u=t/seg,u2=u*u,u3=u2*u;const f=k=>.5*(2*b[k]+(-a[k]+c[k])*u+(2*a[k]-5*b[k]+4*c[k]-d[k])*u2+(-a[k]+3*b[k]-3*c[k]+d[k])*u3);out.push([f(0),f(1)])}}return out}

 st(0,f1e,f1a,tiny[0],tiny[1]),
 st(0,`Write why this matters to you in one sentence, and what will be different in your life once it is done.`,`اكتب لماذا يهمك هذا في جملة واحدة، وماذا سيتغيّر في حياتك عندما يتحقق.`,`Write just the "why" in 5 words`,`اكتب «لماذا» في 5 كلمات فقط`),
 st(0,`You want this within a month, so set 3 checkpoints: what will be done by day 7, by day 14 and by day 30.`,`تريد هذا خلال شهر، فضع 3 محطات: ماذا سيكون منجزاً في اليوم 7 وفي اليوم 14 وفي اليوم 30.`,`Write only the day 7 checkpoint`,`اكتب محطة اليوم 7 فقط`,['when',['month']]),
 st(0,`Break this into 3 milestones and give each a rough date. Your target: {when}.`,`قسّم هذا إلى 3 مراحل وضع لكل مرحلة تاريخاً تقريبياً. موعدك: {when}.`,`Write just milestone 1`,`اكتب المرحلة الأولى فقط`,['when',['q','year','none']]),
 st(1,`Getting started is the hard part, so shrink it: write one action that takes under 5 minutes and attach it to something you already do ("After my morning coffee I will ___").`,`البدء هو الجزء الصعب، لذلك صغّره: اكتب خطوة تستغرق أقل من 5 دقائق واربطها بشيء تفعله أصلاً («بعد قهوة الصباح سأقوم بـ ___»).`,`Write the 5-minute action only`,`اكتب خطوة الـ 5 دقائق فقط`,['start',['stuck']]),
 st(1,`Write what this will cost in AED, one-off and monthly. Decide where the money comes from and what you can pause to fund it.`,`اكتب كم سيكلّف هذا بالدرهم، دفعة واحدة وشهرياً. قرّر من أين سيأتي المال وما الذي يمكنك إيقافه لتمويله.`,`Write only the total cost`,`اكتب التكلفة الإجمالية فقط`,['start',['money']]),
 st(1,`Find ONE beginner resource (a course, a book or a person who has done it) and spend the first 10 minutes with it.`,`ابحث عن مصدر واحد للمبتدئين (دورة أو كتاب أو شخص سبق أن فعلها) واقضِ أول 10 دقائق معه.`,`Just find the resource`,`اعثر على المصدر فقط`,['start',['learn']]),
 st(1,`Write the next 3 actions in order. The first one must take under 15 minutes.`,`اكتب الخطوات الثلاث التالية بالترتيب. الأولى يجب ألا تستغرق أكثر من 15 دقيقة.`,`Write just the first action`,`اكتب الخطوة الأولى فقط`,['start',['know']]),
 st(1,`Decide who to involve and write their name, plus the one question or request you will bring to them. Message them today.`,`قرّر من تُشركه واكتب اسمه، مع السؤال أو الطلب الواحد الذي ستحمله إليه. راسله اليوم.`,`Write the name only`,`اكتب الاسم فقط`,['who',['people','expert']]),
 st(2,`Do the first action now. Set a 15-minute timer and stop when it rings, even if you want to keep going.`,`نفّذ الخطوة الأولى الآن. اضبط مؤقتاً لـ 15 دقيقة وتوقف عند انتهائه حتى لو أردت المتابعة.`,`Work for just 5 minutes`,`اعمل 5 دقائق فقط`),
 st(2,`Put the next 3 actions in your calendar with exact times this week.`,`ضع الخطوات الثلاث التالية في تقويمك بمواعيد محددة هذا الأسبوع.`,`Schedule just one`,`جدول واحدة فقط`),
 st(2,`Review: what worked, what blocked you, and what is the next checkpoint? Adjust the plan.`,`راجع: ما الذي نجح، وما الذي أعاقك، وما المحطة التالية؟ عدّل الخطة.`,`Write one thing that worked`,`اكتب شيئاً واحداً نجح`)]});

const PB={
 creator:{cl:'create',ph:[PH(`Clarity`,`الوضوح`),PH(`Set up`,`التجهيز`),PH(`First video`,`أول فيديو`),PH(`Rhythm`,`الإيقاع`),PH(`Grow`,`النمو`)],
  ex:{en:`Example: Cars content on Instagram to get brand partnerships`,ar:`مثال: محتوى عن السيارات على إنستغرام للحصول على شراكات مع العلامات`},
  note:{en:`Pick one platform. Two is how this one dies. Rules change, so check the permit details yourself.`,ar:`اختر منصة واحدة. اثنتان هما سبب موت هذا الهدف. القوانين تتغيّر، فتحقق من تفاصيل التصريح بنفسك.`},
  fb:{topic:{en:`your topic`,ar:`موضوعك`},plat:{en:`your platform`,ar:`منصتك`}},
  q:[Q('topic',`What will you make content about?`,`عمّ ستصنع المحتوى؟`,[op('cars',`cars`,`السيارات`),op('music',`music`,`الموسيقى`),op('fitness',`fitness and food`,`اللياقة والطعام`),op('biz',`business and money`,`الأعمال والمال`),op('life',`lifestyle and travel`,`نمط الحياة والسفر`),op('other',`your topic`,`موضوعك`,`Something else`,`شيء آخر`)]),
   Q('plat',`Which platform first?`,`أي منصة أولاً؟`,[op('Instagram',`Instagram`,`إنستغرام`),op('TikTok',`TikTok`,`تيك توك`),op('YouTube',`YouTube`,`يوتيوب`),op('unsure',`your platform`,`منصتك`,`Not sure yet`,`لست متأكداً بعد`)]),
   Q('goal',`What do you want from it?`,`ماذا تريد منه؟`,[op('money',`Income and brand deals`,`دخل وشراكات`),op('brand',`A personal brand for my career`,`علامة شخصية لمسيرتي`),op('fun',`Share what I love`,`مشاركة ما أحب`),op('biz',`Grow a business`,`تنمية عمل`)])],
  steps:[
   st(0,`Write 3 angles on {topic} you could talk about for hours, and one thing most videos about it get wrong.`,`اكتب 3 زوايا في موضوع {topic} تستطيع الحديث عنها لساعات، وشيئاً واحداً يخطئ فيه معظم من يتحدث عنه.`,`Write just one angle`,`اكتب زاوية واحدة فقط`),
   st(0,`Finish this sentence: "My content helps ___ do ___". Then name one real person you picture watching (a friend, a colleague).`,`أكمل الجملة: «محتواي يساعد ___ على ___». ثم سمِّ شخصاً حقيقياً واحداً تتخيله يشاهدك (صديق أو زميل).`,`Write who it helps, in 3 words`,`اكتب من تساعده في 3 كلمات`),
   st(0,`Pick your platform. Reels for quick reach, TikTok for discovery, YouTube for long-term searchable content. Choose the one you already open most.`,`اختر منصتك. ريلز للانتشار السريع، تيك توك للاكتشاف، يوتيوب للمحتوى الدائم الذي يظهر في البحث. اختر ما تفتحه أكثر.`,`Pick the app you open most`,`اختر التطبيق الذي تفتحه أكثر`,['plat',['unsure']]),
   st(0,`Watch 5 posts from 3 creators in {topic}. Write what they all do the same (hook, length, captions) and one gap you could fill.`,`شاهد 5 منشورات لـ 3 صنّاع محتوى في موضوع {topic}. اكتب ما يتشابهون فيه (الافتتاحية، المدة، الوصف) وثغرة واحدة يمكنك سدّها.`,`Watch just one post`,`شاهد منشوراً واحداً فقط`),
   st(1,`Set up your {plat} account: a clear name, a one-line bio that says who it helps, and a profile photo where your face is visible.`,`جهّز حسابك على {plat}: اسم واضح، ونبذة من سطر واحد تقول من تساعد، وصورة شخصية يظهر فيها وجهك.`,`Choose the profile photo`,`اختر الصورة الشخصية فقط`),
   st(1,`UAE check: posting ads or sponsored content, paid or not, needs a UAE Media Council Advertiser Permit (uaemc.gov.ae), and residents also need an e-media trade licence. Check the current rules before your first sponsored post.`,`تحقق من الإمارات: نشر الإعلانات أو المحتوى المدفوع، سواء بمقابل أو دونه، يتطلب «تصريح معلن» من المجلس الإماراتي للإعلام (uaemc.gov.ae)، والمقيمون يحتاجون أيضاً رخصة تجارية للإعلام الإلكتروني. راجع الشروط الحالية قبل أول منشور إعلاني.`,`Just open uaemc.gov.ae`,`افتح uaemc.gov.ae فقط`,['goal',['money','biz']]),
   st(1,`Film a 30-second test video on your phone: face a window for light, hold the phone at eye level, and start talking within 2 seconds. Do not post it.`,`صوّر فيديو تجريبياً مدته 30 ثانية بهاتفك: واجه نافذة للإضاءة، وضع الهاتف بمستوى العينين، وابدأ الكلام خلال ثانيتين. لا تنشره.`,`Film 5 seconds of anything`,`صوّر 5 ثوانٍ من أي شيء`),
   st(1,`Watch it muted, then with sound. Write one fix for light, one for sound and one for length.`,`شاهده بدون صوت ثم بالصوت. اكتب تحسيناً للإضاءة وآخر للصوت وآخر للمدة.`,`Watch the first 5 seconds`,`شاهد أول 5 ثوانٍ فقط`),
   st(2,`Write the hook for video 1: one sentence that makes a stranger stay 3 more seconds (a question, a surprising number or a bold claim).`,`اكتب افتتاحية الفيديو الأول: جملة واحدة تجعل الغريب يبقى 3 ثوانٍ إضافية (سؤال أو رقم مفاجئ أو ادعاء جريء).`,`Write 3 hook options, pick later`,`اكتب 3 افتتاحيات واختر لاحقاً`),
   st(2,`Film video 1 (30 to 60 seconds): hook, one point, one call to action (follow, comment or save). Maximum 3 takes.`,`صوّر الفيديو الأول (30 إلى 60 ثانية): افتتاحية، فكرة واحدة، ودعوة لإجراء (تابع أو علّق أو احفظ). 3 محاولات كحد أقصى.`,`Film just the hook`,`صوّر الافتتاحية فقط`),
   st(2,`Edit and post video 1 with a caption and 3 to 5 relevant hashtags. Done beats perfect.`,`مَنتِج الفيديو الأول وانشره مع وصف و3 إلى 5 وسوم مناسبة. الإنجاز أفضل من الكمال.`,`Write the caption only`,`اكتب الوصف فقط`),
   st(2,`24 hours later, write down views, watch time and comments for video 1. Just the numbers, no judgement.`,`بعد 24 ساعة دوّن المشاهدات ومدة المشاهدة والتعليقات للفيديو الأول. الأرقام فقط دون حكم.`,`Write the view count only`,`دوّن عدد المشاهدات فقط`),
   st(3,`Choose 2 posting days a week and a 60-minute filming block. Put both in your calendar.`,`اختر يومين للنشر في الأسبوع وساعة للتصوير. ضعهما في تقويمك.`,`Pick just one posting day`,`اختر يوم نشر واحداً فقط`),
   st(3,`Batch it: write 3 scripts in one sitting (hook, point, ending), then film all 3 in one session.`,`اعمل بالدفعات: اكتب 3 سيناريوهات في جلسة واحدة (افتتاحية، فكرة، خاتمة)، ثم صوّرها كلها في جلسة واحدة.`,`Write only the first line of script 1`,`اكتب أول سطر من السيناريو الأول فقط`),
   st(3,`Post 8 videos over 4 weeks (2 a week). After each one, log the views and one lesson in your notes.`,`انشر 8 فيديوهات خلال 4 أسابيع (فيديوهان أسبوعياً). بعد كل واحد دوّن المشاهدات ودرساً واحداً في ملاحظاتك.`,`Post one`,`انشر واحداً فقط`),
   st(4,`Open your stats, find your 2 best posts and make 3 more in the same style.`,`افتح الإحصائيات، وابحث عن أفضل منشورين، وأنتج 3 منشورات أخرى بالأسلوب نفسه.`,`Just find your best post`,`اعرف أفضل منشور فقط`),
   st(4,`After 8 videos, decide: keep this platform, change your style, or add a second platform. Write the decision and the date you will review it.`,`بعد 8 فيديوهات قرّر: تبقى على المنصة أم تغيّر أسلوبك أم تضيف منصة ثانية. اكتب القرار وتاريخ مراجعته.`,`Write one thing you like about it`,`اكتب شيئاً واحداً يعجبك فيها`)]},

 weight:{cl:'body',ph:[PH(`Baseline`,`نقطة البداية`),PH(`Habits`,`العادات`),PH(`Movement`,`الحركة`),PH(`Momentum`,`الزخم`)],
  ex:{en:`Example: Lose 8 kg by March and feel lighter`,ar:`مثال: إنقاص 8 كغ بحلول مارس والشعور بخفة أكبر`},
  note:{en:`Small and daily beats big and Monday. This is not medical advice: check with a doctor before big changes to your diet or exercise.`,ar:`الصغير اليومي أفضل من الكبير الذي يبدأ يوم الاثنين. هذا ليس نصيحة طبية: استشر طبيباً قبل أي تغيير كبير في غذائك أو تمارينك.`},
  fb:{time:{en:`20 minutes`,ar:`20 دقيقة`}},
  q:[Q('aim',`What do you want?`,`ماذا تريد؟`,[op('lose',`lose weight`,`إنقاص الوزن`),op('muscle',`build muscle`,`بناء العضلات`),op('fit',`get fitter`,`زيادة اللياقة`),op('keep',`keep the weight off`,`الحفاظ على الوزن`)]),
   Q('time',`How much time can you give on most days?`,`كم من الوقت تستطيع تخصيصه في معظم الأيام؟`,[op('15',`15 minutes`,`15 دقيقة`),op('30',`30 minutes`,`30 دقيقة`),op('45',`45 minutes`,`45 دقيقة`,`45 minutes or more`,`45 دقيقة أو أكثر`)]),
   Q('hard',`What is hardest for you?`,`ما أصعب شيء عليك؟`,[op('eat',`Eating well`,`الأكل الصحي`),op('move',`Moving enough`,`الحركة الكافية`),op('stay',`Staying consistent`,`الاستمرار`),op('sleep',`Sleep and stress`,`النوم والتوتر`)])],
  steps:[
   st(0,`Weigh yourself tomorrow morning after the bathroom and before eating. Write the number in your phone notes (e.g. "Day 1: 84.2 kg").`,`قِس وزنك غداً صباحاً بعد دورة المياه وقبل الأكل. دوّن الرقم في ملاحظات هاتفك (مثال: «اليوم 1: 84.2 كغ»).`,`Just step on the scale`,`قف على الميزان فقط`),
   st(0,`Take 3 photos (front, side, back) and measure your waist at the navel. The scale alone hides progress.`,`التقط 3 صور (من الأمام والجانب والخلف) وقِس خصرك عند السرة. الميزان وحده يخفي التقدم.`,`Take just the front photo`,`التقط صورة الأمام فقط`),
   st(0,`Set your target weight and date. A pace of about 0.5 to 1 kg a week is generally considered safe, so 8 kg takes roughly 8 to 16 weeks.`,`حدّد وزنك المستهدف وتاريخه. وتيرة تقارب 0.5 إلى 1 كغ أسبوعياً تُعدّ آمنة عموماً، فإنقاص 8 كغ يستغرق نحو 8 إلى 16 أسبوعاً.`,`Write only the target number`,`اكتب رقم الهدف فقط`,['aim',['lose']]),
   st(0,`Write the one measurable target for your goal (e.g. "bench press 60 kg", "run 5 km without stopping") and the date.`,`اكتب هدفاً واحداً قابلاً للقياس (مثل «رفع 60 كغ في البنش» أو «ركض 5 كم دون توقف») وتاريخه.`,`Write only the number`,`اكتب الرقم فقط`,['aim',['muscle','fit','keep']]),
   st(1,`For 2 days, photograph everything you eat and drink. Change nothing yet. This shows what you really eat.`,`لمدة يومين صوّر كل ما تأكله وتشربه. لا تغيّر شيئاً الآن. هذا يكشف ما تأكله فعلاً.`,`Photograph one meal`,`صوّر وجبة واحدة`),
   st(1,`Pick the ONE meal or snack that hurts most (often the afternoon snack or late dinner) and write its default replacement, e.g. "2 eggs, fruit, coffee".`,`اختر وجبة أو سناكاً واحداً هو الأسوأ أثراً (غالباً سناك العصر أو العشاء المتأخر) واكتب بديله الجاهز، مثل «بيضتان وفاكهة وقهوة».`,`Name the meal only`,`اذكر الوجبة فقط`,['hard',['eat']]),
   st(1,`Check your daily steps for 3 days, then set your step goal at that average plus 1,500.`,`راقب خطواتك اليومية لثلاثة أيام، ثم اجعل هدفك المتوسط مضافاً إليه 1500 خطوة.`,`Check today's steps`,`اطّلع على خطواتك اليوم`,['hard',['move']]),
   st(1,`Link your workout to something you already do (after Fajr, after the work coffee, before the shower) and write the exact trigger sentence.`,`اربط تمرينك بشيء تفعله أصلاً (بعد الفجر، بعد قهوة العمل، قبل الاستحمام) واكتب جملة المحفّز بدقة.`,`Write the trigger only`,`اكتب المحفّز فقط`,['hard',['stay']]),
   st(1,`Set a phone alarm 30 minutes before your target bedtime. Most adults need 7 or more hours, and poor sleep makes hunger harder to manage.`,`اضبط منبهاً قبل موعد نومك المستهدف بـ 30 دقيقة. معظم البالغين يحتاجون 7 ساعات أو أكثر، وقلة النوم تجعل التحكم بالجوع أصعب.`,`Set the alarm only`,`اضبط المنبه فقط`,['hard',['sleep']]),
   st(1,`Plan tomorrow's lunch tonight: choose a protein, a carb and a vegetable, and write them down.`,`خطّط لغداء الغد الليلة: اختر بروتيناً وكربوهيدرات وخضاراً، ودوّنها.`,`Just choose the protein`,`اختر مصدر البروتين فقط`),
   st(2,`Move for {time} today. A brisk walk counts. Health guidance for adults is about 150 minutes of moderate activity a week, for example 5 sessions of 30 minutes.`,`تحرّك {time} اليوم. المشي السريع يُحسب. التوصية الصحية للبالغين نحو 150 دقيقة من النشاط المعتدل أسبوعياً، مثل 5 جلسات من 30 دقيقة.`,`Walk for 5 minutes`,`امشِ 5 دقائق`),
   st(2,`Choose 3 workout slots this week and add them to your calendar with exact times.`,`اختر 3 مواعيد للتمرين هذا الأسبوع وأضفها إلى تقويمك بوقت محدد.`,`Pick just one slot`,`اختر موعداً واحداً فقط`),
   st(2,`Do your first strength session: squats, push-ups (on your knees if needed) and rows, 3 sets of 8 to 12 each, with a rest day after.`,`نفّذ أول جلسة قوة: سكوات وضغط (على الركبتين إن لزم) وتجديف، 3 مجموعات من 8 إلى 12 لكل تمرين، ثم يوم راحة.`,`Do one set of squats`,`نفّذ مجموعة سكوات واحدة`,['aim',['muscle','fit','lose']]),
   st(3,`After 2 weeks, weigh yourself again, take the photos and compare with day one. Write the 3 numbers: weight, waist, weekly minutes of exercise.`,`بعد أسبوعين قِس وزنك مجدداً والتقط الصور وقارن بالبداية. دوّن 3 أرقام: الوزن والخصر ودقائق التمرين الأسبوعية.`,`Just weigh yourself`,`قِس وزنك فقط`),
   st(3,`Write what worked and what did not. Keep the first, drop the second, and set the target for the next 4 weeks.`,`اكتب ما نجح وما لم ينجح. أبقِ الأول واترك الثاني، وحدّد هدف الأسابيع الأربعة القادمة.`,`Write one thing that worked`,`اكتب شيئاً واحداً نجح`)]},

 money:{cl:'money',ph:[PH(`Map it`,`ارسم الصورة`),PH(`Rules`,`القواعد`),PH(`Test it`,`جرّب`),PH(`Scale it`,`وسّع`)],

  fb:{amt:{en:`your target`,ar:`هدفك`}},
  q:[Q('amt',`How much extra per month?`,`كم تريد إضافة شهرياً؟`,[op('1000',`AED 1,000`,`1000 درهم`),op('3000',`AED 3,000`,`3000 درهم`),op('5000',`AED 5,000`,`5000 درهم`),op('10000',`AED 10,000 or more`,`10000 درهم أو أكثر`)]),
   Q('route',`How would you earn it?`,`كيف ستكسبه؟`,[op('skill',`Using my skills (services)`,`بمهاراتي (خدمات)`),op('sell',`Selling products`,`ببيع منتجات`),op('online',`Content or online work`,`بمحتوى أو عمل عبر الإنترنت`),op('invest',`Saving or investing more`,`بادخار أو استثمار أكثر`),op('unsure',`Not sure yet`,`لست متأكداً بعد`)]),
   Q('hrs',`Hours per week you can give?`,`كم ساعة أسبوعياً تستطيع تخصيصها؟`,[op('4',`3 to 5`,`من 3 إلى 5`),op('8',`6 to 10`,`من 6 إلى 10`),op('12',`10 or more`,`10 أو أكثر`)])],
  steps:[
   st(0,`Open your bank app and write last month's income and expenses in 3 columns: income, fixed, flexible. Circle what you could cut.`,`افتح تطبيق البنك واكتب دخل الشهر الماضي ومصروفاته في 3 أعمدة: الدخل، الثابت، المرن. ضع دائرة حول ما يمكنك تقليصه.`,`Write your main income only`,`اكتب دخلك الأساسي فقط`),
   st(0,`Write your target as a sentence: "I want AED {amt} extra a month by [date]". That is AED 12 times that a year.`,`اكتب هدفك كجملة: «أريد {amt} إضافية شهرياً بحلول [تاريخ]». لاحظ أنه يساوي 12 ضعفه في السنة.`,`Write just the date`,`اكتب التاريخ فقط`),
   st(0,`List 3 skills people have paid you for or asked you for help with, and write who asked.`,`اكتب 3 مهارات دفع الناس مقابلها أو طلبوا مساعدتك فيها، ومن الذي طلب.`,`List one skill`,`اكتب مهارة واحدة`,['route',['skill','online','unsure']]),
   st(0,`Choose 3 products you could sell and write for each: what it costs you, what you would charge, and your profit per item.`,`اختر 3 منتجات يمكنك بيعها واكتب لكل منها: تكلفتك، وسعر البيع، وربحك من كل قطعة.`,`Write one product idea`,`اكتب فكرة منتج واحدة`,['route',['sell']]),
   st(0,`Check your emergency cushion: do you have about 3 months of expenses saved? Write the number. If not, make that the first target before investing.`,`تحقق من احتياطيك: هل لديك مدخرات تغطي نحو 3 أشهر من المصاريف؟ دوّن الرقم. إن لم يكن، فليكن هذا هدفك الأول قبل الاستثمار.`,`Write your monthly expenses`,`اكتب مصاريفك الشهرية فقط`,['route',['invest']]),
   st(1,`Before earning, check the rules: a side income in the UAE needs the right permit (a freelance permit, a free-zone licence or a MOHRE part-time permit). Read your contract for consent or non-compete clauses, and note which route fits.`,`قبل أن تكسب تحقق من القواعد: الدخل الإضافي في الإمارات يحتاج التصريح المناسب (تصريح عمل حر أو رخصة منطقة حرة أو تصريح عمل بدوام جزئي من الوزارة). اقرأ عقدك بحثاً عن بنود الموافقة أو عدم المنافسة، ودوّن المسار المناسب.`,`Just read your contract's side-work clause`,`اقرأ بند العمل الإضافي في عقدك فقط`,['route',['skill','sell','online']]),
   st(1,`Compare 2 or 3 savings or investment options. For each write: the fees, how fast you can withdraw, and the risk. Pick none yet.`,`قارن بين خيارين أو ثلاثة للادخار أو الاستثمار. لكل خيار اكتب: الرسوم، وسرعة السحب، والمخاطر. لا تختر بعد.`,`Look at one option`,`اطّلع على خيار واحد`,['route',['invest']]),
   st(1,`Block {hrs} hours a week for this in your calendar. Treat them like a meeting.`,`خصّص ساعات أسبوعية لهذا في تقويمك ({hrs}). تعامل معها كأنها اجتماع.`,`Block just one hour`,`خصّص ساعة واحدة فقط`),
   st(2,`Name your offer in one line: "I help [who] get [result] for AED [price]". Show it to one friend and ask if it is clear.`,`صغ عرضك في سطر واحد: «أساعد [من] على [نتيجة] مقابل [سعر] درهم». أره لصديق واسأله إن كان واضحاً.`,`Decide the price only`,`قرّر السعر فقط`),
   st(2,`Message 5 people who might pay for it and ask if they are interested. Write the 5 names first.`,`راسل 5 أشخاص قد يدفعون مقابله واسألهم إن كانوا مهتمين. اكتب الأسماء الخمسة أولاً.`,`Message one person`,`راسل شخصاً واحداً`),
   st(2,`Get your first paying customer or make your first sale. Then ask for a one-line testimonial.`,`احصل على أول عميل يدفع لك أو نفّذ أول عملية بيع. ثم اطلب شهادة من سطر واحد.`,`Follow up with one person`,`تابع مع شخص واحد`),
   st(3,`Review: income earned, hours spent, and your hourly rate. Keep what pays best per hour.`,`راجع: الدخل المحقق، والساعات المستغرقة، وأجرك بالساعة. أبقِ على ما يدرّ أكثر لكل ساعة.`,`Write the income number only`,`اكتب رقم الدخل فقط`),
   st(3,`Repeat the thing that worked 2 more times, and write what you will raise or automate.`,`كرّر ما نجح مرتين إضافيتين، واكتب ما ستزيده أو تؤتمته.`,`Plan the repeat only`,`خطّط للتكرار فقط`),
   st(3,`Pick a fixed weekly day for a 10-minute money check, and put it in your calendar.`,`اختر يوماً أسبوعياً ثابتاً لمراجعة أموالك 10 دقائق وضعه في تقويمك.`,`Choose the day`,`اختر اليوم فقط`)]},

 car:{cl:'money',ph:[PH(`Budget`,`الميزانية`),PH(`Choose`,`الاختيار`),PH(`Buy`,`الشراء`)],
  ex:{en:`Example: Buy a reliable SUV for the family under AED 90,000`,ar:`مثال: شراء سيارة دفع رباعي موثوقة للعائلة بأقل من 90000 درهم`},
  note:{en:`UAE fees and rules change. Confirm the current numbers with the RTA or your emirate's traffic authority.`,ar:`الرسوم والقواعد في الإمارات تتغيّر. تأكد من الأرقام الحالية لدى هيئة الطرق أو إدارة المرور في إمارتك.`},
  fb:{kind:{en:`car`,ar:`السيارة`}},
  q:[Q('pay',`How will you pay?`,`كيف ستدفع؟`,[op('cash',`Cash`,`نقداً`),op('loan',`Bank loan`,`قرض بنكي`),op('unsure',`Not sure yet`,`لست متأكداً بعد`)]),
   Q('kind',`New or used?`,`جديدة أم مستعملة؟`,[op('new',`new car`,`سيارة جديدة`,`New`,`جديدة`),op('used',`used car`,`سيارة مستعملة`,`Used`,`مستعملة`),op('unsure',`car`,`السيارة`,`Not sure`,`لست متأكداً`)]),
   Q('bud',`Your total budget?`,`ميزانيتك الإجمالية؟`,[op('50',`Under AED 50,000`,`أقل من 50000 درهم`),op('100',`AED 50,000 to 100,000`,`من 50000 إلى 100000 درهم`),op('200',`AED 100,000 to 200,000`,`من 100000 إلى 200000 درهم`),op('200p',`Over AED 200,000`,`أكثر من 200000 درهم`)])],
  steps:[
   st(0,`Write your real monthly cost of owning a {kind}: payment, insurance, fuel, Salik, parking and servicing. Decide the total you can afford without touching savings.`,`اكتب التكلفة الشهرية الحقيقية لامتلاك {kind}: القسط والتأمين والوقود وسالك والمواقف والصيانة. حدّد الإجمالي الذي تتحمله دون المساس بمدخراتك.`,`Write just the fuel cost`,`اكتب تكلفة الوقود فقط`),
   st(0,`Check your documents: a valid UAE residence visa and Emirates ID, and a UAE driving licence (a foreign licence has to be converted before you can register a car).`,`تحقق من أوراقك: إقامة إماراتية سارية وهوية إماراتية ورخصة قيادة إماراتية (الرخصة الأجنبية يجب تحويلها قبل تسجيل سيارة).`,`Check your licence expiry date`,`تحقق من تاريخ انتهاء رخصتك`),
   st(0,`Ask 2 banks for a car-loan estimate: rate, down payment, processing fee and early-settlement fee. Write them side by side.`,`اطلب من بنكين تقديراً لقرض سيارة: الفائدة والدفعة الأولى ورسوم المعالجة ورسوم السداد المبكر. اكتبها جنباً إلى جنب.`,`Ask one bank`,`اسأل بنكاً واحداً`,['pay',['loan','unsure']]),
   st(1,`Shortlist 3 models. For each, get an insurance quote and check the yearly registration cost, fuel use and what it sells for after 3 years.`,`اختر 3 موديلات. لكل منها احصل على عرض تأمين واعرف تكلفة التسجيل السنوية واستهلاك الوقود وسعر إعادة البيع بعد 3 سنوات.`,`Shortlist just one model`,`اختر موديلاً واحداً فقط`),
   st(1,`New car: ask 2 dealers for the all-in price in writing (VAT, registration, insurance, warranty and service plan).`,`سيارة جديدة: اطلب من وكيلين السعر الإجمالي كتابةً (الضريبة والتسجيل والتأمين والضمان وخطة الصيانة).`,`Ask one dealer`,`اسأل وكيلاً واحداً`,['kind',['new','unsure']]),
   st(1,`Used car: check the Mulkiya, match the chassis number to the report, look up fines and accident history, and book an independent inspection before you pay.`,`سيارة مستعملة: افحص الملكية وطابق رقم الشاصي مع التقرير وتحقق من المخالفات وسجل الحوادث، واحجز فحصاً مستقلاً قبل الدفع.`,`Ask for the Mulkiya photo`,`اطلب صورة الملكية فقط`,['kind',['used','unsure']]),
   st(1,`Test drive your top choice for at least 20 minutes: highway, parking, and the back seat. Write 3 things you liked and 3 you did not.`,`جرّب قيادة خيارك الأول 20 دقيقة على الأقل: طريق سريع ومواقف والمقعد الخلفي. دوّن 3 أشياء أعجبتك و3 لم تعجبك.`,`Book the test drive`,`احجز التجربة فقط`),
   st(2,`Set your maximum price and a decision date, then negotiate: ask for the best price, a free service or extras, and walk away if it is above your number.`,`حدّد أعلى سعر وتاريخ القرار، ثم فاوض: اطلب أفضل سعر وصيانة أو إضافات مجانية، وانسحب إن تجاوز رقمك.`,`Write the max price only`,`اكتب أعلى سعر فقط`),
   st(2,`Buy insurance in your name before registration or transfer. The RTA requires valid insurance first.`,`اشترِ التأمين باسمك قبل التسجيل أو نقل الملكية. هيئة الطرق تشترط تأميناً ساري المفعول أولاً.`,`Get one quote`,`احصل على عرض واحد`),
   st(2,`Register or transfer the car with your Emirates ID, licence, insurance and the old Mulkiya (a new car is usually registered by the dealer; a used-car transfer costs a few hundred dirhams plus testing if required). Keep the new Mulkiya safe.`,`سجّل السيارة أو انقل ملكيتها بالهوية والرخصة والتأمين والملكية القديمة (السيارة الجديدة يسجلها الوكيل عادةً؛ ونقل المستعملة يكلّف بضع مئات من الدراهم مع الفحص إن لزم). احفظ الملكية الجديدة.`,`Check which documents you are missing`,`اعرف الأوراق الناقصة فقط`)]},

 laptop:{cl:'money',ph:[PH(`Needs`,`الاحتياج`),PH(`Compare`,`المقارنة`),PH(`Buy`,`الشراء`)],
  ex:{en:`Example: A laptop for editing 4K videos under AED 6,000`,ar:`مثال: لابتوب لمونتاج فيديو 4K بأقل من 6000 درهم`},
  note:{en:`Big sale events (like White Friday in late November) can cut prices, so check timing before buying.`,ar:`مواسم التخفيضات الكبرى (مثل الجمعة البيضاء في أواخر نوفمبر) قد تخفض الأسعار، فتحقق من التوقيت قبل الشراء.`},
  fb:{use:{en:`your work`,ar:`عملك`}},
  q:[Q('use',`What is it mainly for?`,`لماذا تريده أساساً؟`,[op('work',`office work`,`العمل المكتبي`,`Work`,`العمل`),op('create',`video and design work`,`المونتاج والتصميم`,`Editing and design`,`مونتاج وتصميم`),op('game',`gaming`,`الألعاب`,`Gaming`,`ألعاب`),op('study',`studying`,`الدراسة`,`Study`,`دراسة`)]),
   Q('bud',`Your budget?`,`ميزانيتك؟`,[op('3',`Under AED 3,000`,`أقل من 3000 درهم`),op('6',`AED 3,000 to 6,000`,`من 3000 إلى 6000 درهم`),op('10',`AED 6,000 to 10,000`,`من 6000 إلى 10000 درهم`),op('10p',`Over AED 10,000`,`أكثر من 10000 درهم`)]),
   Q('os',`Windows or Mac?`,`ويندوز أم ماك؟`,[op('win',`Windows`,`ويندوز`),op('mac',`Mac`,`ماك`),op('any',`No preference`,`لا فرق`)])],
  steps:[
   st(0,`Write the 3 things you must do on it every week, and what slows you down on your current device.`,`اكتب 3 أشياء يجب أن تفعلها عليه كل أسبوع، وما الذي يبطئك في جهازك الحالي.`,`Write one thing`,`اكتب شيئاً واحداً`),
   st(0,`Editing and design need at least 16 GB of RAM, a 512 GB SSD and a colour-accurate screen. Write your minimum specs.`,`المونتاج والتصميم يحتاجان 16 غيغابايت رام على الأقل وذاكرة SSD بسعة 512 غيغابايت وشاشة دقيقة الألوان. اكتب مواصفاتك الدنيا.`,`Write only the RAM`,`اكتب الرام فقط`,['use',['create']]),
   st(0,`For gaming, a dedicated graphics card matters most, then 16 GB of RAM and good cooling. Write the games you play and their recommended specs.`,`في الألعاب أهم شيء كرت الشاشة المستقل، ثم 16 غيغابايت رام وتبريد جيد. اكتب الألعاب التي تلعبها ومواصفاتها الموصى بها.`,`Write the heaviest game`,`اكتب أثقل لعبة فقط`,['use',['game']]),
   st(0,`For work or study, aim for 16 GB of RAM (8 GB is the bare minimum), an SSD and 8 hours of real battery life. Write your minimum specs.`,`للعمل أو الدراسة اهدف إلى 16 غيغابايت رام (8 هي الحد الأدنى فقط) وSSD وبطارية تدوم 8 ساعات فعلية. اكتب مواصفاتك الدنيا.`,`Write only the battery hours`,`اكتب ساعات البطارية فقط`,['use',['work','study']]),
   st(0,`Set your maximum price and a buy-by date.`,`حدّد أعلى سعر وتاريخ الشراء.`,`Write the max price`,`اكتب أعلى سعر فقط`),
   st(1,`Shortlist 3 laptops that meet your specs and put them in a table: price, RAM, storage, weight, battery, warranty.`,`اختر 3 لابتوبات تحقق مواصفاتك وضعها في جدول: السعر والرام والتخزين والوزن والبطارية والضمان.`,`Shortlist one`,`اختر واحداً فقط`),
   st(1,`Read or watch 2 independent reviews for each (not the store's page). Write one problem each laptop has.`,`اقرأ أو شاهد مراجعتين مستقلتين لكل جهاز (وليس صفحة المتجر). اكتب مشكلة واحدة في كل جهاز.`,`Read one review`,`اقرأ مراجعة واحدة`),
   st(1,`Check the warranty and where the service centre is in the UAE. Write how long a repair would take.`,`تحقق من الضمان ومكان مركز الصيانة في الإمارات. اكتب كم تستغرق عملية الإصلاح.`,`Check one warranty`,`تحقق من ضمان واحد`),
   st(2,`Compare the price at 3 stores, including any sales or trade-in offers and the delivery fee. Write the lowest.`,`قارن السعر في 3 متاجر مع التخفيضات وعروض الاستبدال ورسوم التوصيل. اكتب أقلها.`,`Check one store`,`تحقق من متجر واحد`),
   st(2,`Buy it, keep the invoice, and register the warranty the same day.`,`اشتره، واحتفظ بالفاتورة، وسجّل الضمان في اليوم نفسه.`,`Add it to the cart`,`أضفه إلى السلة فقط`)]},

 marry:{cl:'life',ph:[PH(`Clarity`,`الوضوح`),PH(`Together`,`معاً`),PH(`Paperwork`,`الأوراق`),PH(`Plan`,`التخطيط`)],
  ex:{en:`Example: Get engaged this year and marry next summer`,ar:`مثال: الخطوبة هذه السنة والزواج الصيف القادم`},
  note:{en:`A theme with milestones, not a checklist. Legal requirements vary by emirate and situation, so confirm them with the official authority.`,ar:`محور بمراحل، وليس قائمة مهام. المتطلبات القانونية تختلف بحسب الإمارة والحالة، فتأكد منها لدى الجهة الرسمية.`},
  q:[Q('stage',`Where are you now?`,`أين أنت الآن؟`,[op('think',`Thinking about it`,`أفكّر في الأمر`),op('partner',`I have a partner, not engaged`,`لدي شريك، دون خطوبة`),op('engaged',`Engaged`,`مخطوب`)]),
   Q('when',`When are you aiming for?`,`متى تهدف؟`,[op('year',`Within a year`,`خلال سنة`),op('two',`In 1 to 2 years`,`خلال سنة إلى سنتين`),op('none',`No date yet`,`بلا موعد بعد`)]),
   Q('first',`What worries you most?`,`ما أكثر ما يقلقك؟`,[op('money',`Money`,`المال`),op('family',`Family approval`,`موافقة العائلة`),op('date',`Venue and date`,`المكان والموعد`),op('paper',`Paperwork`,`الأوراق`)])],
  steps:[
   st(0,`Write the 3 values that matter most to you in a marriage, and one thing you will not compromise on.`,`اكتب القيم الثلاث الأهم لك في الزواج، وشيئاً واحداً لن تتنازل عنه.`,`Write one value`,`اكتب قيمة واحدة`),
   st(0,`Write what "ready" means to you in 3 lines: money, home and timing.`,`اكتب ما تعنيه كلمة «جاهز» بالنسبة لك في 3 أسطر: المال والبيت والتوقيت.`,`Write just the money line`,`اكتب سطر المال فقط`),
   st(1,`Have a relaxed talk with your partner about the future, no agenda. Ask each other the same 3 questions: where we live, children, money habits.`,`تحدّث مع شريكتك بهدوء عن المستقبل دون أجندة. اسألا بعضكما الأسئلة نفسها: أين نسكن، الأطفال، عادات المال.`,`Ask just one question`,`اطرح سؤالاً واحداً فقط`,['stage',['think','partner']]),
   st(1,`Decide who you need to tell first (family, close friends) and plan how and when. Write the first sentence you will say.`,`قرّر من يجب أن تخبره أولاً (العائلة أو الأصدقاء المقرّبون) وخطّط كيف ومتى. اكتب الجملة الأولى التي ستقولها.`,`Write the first sentence`,`اكتب الجملة الأولى فقط`,['first',['family']]),
   st(1,`List the big milestones (engagement, venue, paperwork) with a rough month for each, and who is involved in each.`,`اكتب المحطات الكبرى (الخطوبة والمكان والأوراق) مع شهر تقريبي لكل منها ومن يشارك فيها.`,`List the milestones only`,`اكتب المحطات فقط`),
   st(2,`Marriage in the UAE needs a pre-marital medical screening for both of you, and reports are time-limited, so book it close to your date. Find where to do it in your emirate.`,`الزواج في الإمارات يتطلب فحصاً طبياً قبل الزواج للطرفين، والتقارير محدودة الصلاحية، لذا احجزه قريباً من موعدك. اعرف أين تجريه في إمارتك.`,`Find the nearest centre`,`اعرف أقرب مركز فقط`,['first',['paper']]),
   st(2,`Confirm how and where the marriage is registered for your situation (Sharia court or an authorised marriage officer; civil options differ by emirate), and list the documents needed (Emirates ID, passports, residence visa for at least one of you in Dubai).`,`تأكد من كيفية ومكان تسجيل الزواج في حالتك (المحكمة الشرعية أو مأذون معتمد؛ والخيارات المدنية تختلف بحسب الإمارة)، واكتب الأوراق المطلوبة (الهوية والجوازات وإقامة لأحدكما على الأقل في دبي).`,`Write just the document list`,`اكتب قائمة الأوراق فقط`),
   st(3,`Set a rough total budget and split it into 5 lines: venue, food, clothes, photos, other. Write the maximum for each.`,`ضع ميزانية إجمالية تقريبية وقسّمها إلى 5 بنود: المكان، الطعام، الملابس، التصوير، أخرى. اكتب الحد الأقصى لكل بند.`,`Write only the total`,`اكتب الإجمالي فقط`),
   st(3,`Choose your target date and work backwards: put 3 checkpoints in your calendar (venue booked, paperwork done, invitations sent).`,`اختر موعدك المستهدف واعمل بالعكس: ضع 3 محطات في تقويمك (حجز المكان، إنهاء الأوراق، إرسال الدعوات).`,`Choose just the month`,`اختر الشهر فقط`)]},

 learn:{cl:'growth',ph:[PH(`Aim`,`الهدف`),PH(`Routine`,`الروتين`),PH(`Practice`,`الممارسة`),PH(`Prove it`,`أثبت ذلك`)],
  ex:{en:`Example: Hold a 5-minute conversation in French by June`,ar:`مثال: إجراء محادثة من 5 دقائق بالفرنسية بحلول يونيو`},
  note:{en:`Short daily sessions beat long weekend ones.`,ar:`الجلسات اليومية القصيرة أفضل من الجلسات الطويلة في نهاية الأسبوع.`},
  fb:{time:{en:`20 minutes`,ar:`20 دقيقة`},what:{en:`this`,ar:`هذا`}},
  q:[Q('what',`What kind of thing is it?`,`ما نوع ما تتعلمه؟`,[op('lang',`a language`,`لغة`),op('music',`an instrument`,`آلة موسيقية`),op('skill',`a work skill`,`مهارة مهنية`),op('study',`an exam or course`,`اختبار أو دورة`)]),
   Q('level',`Your level now?`,`مستواك الآن؟`,[op('zero',`Never started`,`لم أبدأ قط`),op('basic',`Beginner`,`مبتدئ`),op('mid',`Intermediate`,`متوسط`)]),
   Q('time',`Time per day?`,`الوقت يومياً؟`,[op('10',`10 minutes`,`10 دقائق`),op('20',`20 minutes`,`20 دقيقة`),op('30',`30 minutes or more`,`30 دقيقة أو أكثر`)])],
  steps:[
   st(0,`Write what you will be able to DO when you have learned {what}, with a date (e.g. "play 3 songs", "pass the exam", "order lunch in French").`,`اكتب ما ستتمكن من فعله عندما تتعلم {what}، مع تاريخ (مثل «عزف 3 أغانٍ» أو «اجتياز الاختبار» أو «طلب الغداء بالفرنسية»).`,`Write just the date`,`اكتب التاريخ فقط`),

const QUOTA=3;
const condOk=(c,a)=>!c||!!(a&&c[1].includes(a[c[0]]));
const baseSteps=pb=>PB[pb].steps.map((s,i)=>i).filter(i=>condOk(PB[pb].steps[i][5],null)).map(i=>({i,done:false}));
function applyIntake(g,why,a){
  const old=new Map(g.steps.filter(x=>x.i>=0).map(x=>[x.i,x])),cust=g.steps.filter(x=>x.i<0);g.intake={why:why||'',a};
  g.steps=PB[g.pb].steps.map((s,i)=>i).filter(i=>condOk(PB[g.pb].steps[i][5],a)).map(i=>old.get(i)||{i,done:false}).concat(cust);
}
function migrate(s){
  if(!s||!Array.isArray(s.goals))return s;
  if((s.v||0)<4){s.goals.forEach(g=>{if(!PB[g.pb])g.pb='gen_growth';g.intake=null;g.metric=null;g.steps=baseSteps(g.pb)});s.v=4;s.todayDone=[]}
  s.profile=s.profile||{};s.plan=s.plan||null;s.dumps=s.dumps||[];s.released=s.released||0;s.log=s.log||[];if(!s.avatar||s.avatar==='brain'||!AV[s.avatar])s.avatar='spark';
  return s;
}

 ['creator',/content|creator|youtube|tiktok|instagram|vlog|podcast|influenc|صانع محتوى|محتوى|يوتيوب|تيك|انستغرام|بودكاست/i],['weight',/weight|lose|\bfat\b|diet|slim|fitness|get fit|gym|وزن|انقص|رجيم|دهون|لياقة|جيم/i],['learn',/learn|course|study|language|skill|\bread\b|guitar|piano|تعلم|دورة|دراس|لغة|مهار|قراءة|جيتار|بيانو/i],['money',/money|earn|income|salary|raise|business|freelanc|invest|hustle|اكسب|دخل|مال|مشروع|راتب|استثمار|عمل حر/i]];
const CLASSIFY=[[/buy|save|money|income|invest|salary|business|rent|debt|earn|مال|ادخار|دخل|شراء|اشتري|دين/i,'money'],[/run|eat|sleep|health|walk|رياض|صح|مشي|نوم/i,'body'],[/family|move|home|kids|friend|relationship|عائل|أطفال|صديق/i,'life'],[/learn|study|book|تعلم|دراس|كتاب/i,'growth'],[/film|post|music|write|brand|design|فيلم|موسيق|تصميم|كتابة|قناة/i,'create']];
const classify=t=>{t=noDia(t);for(const [r,c] of CLASSIFY)if(r.test(t))return c;return 'growth'};
const pbKey=t=>{const x=noDia(t);for(const [k,r] of DET)if(r.test(x))return k;return 'gen_'+classify(t)};
const cleanTitle=t=>{t=t.trim().replace(/^(i\s+)?(want|wanna|need|have)\s+to\s+/i,'').replace(/^i\s+(want|wanna|need)\s+/i,'').replace(/^(أريد|أبغى|ابغى|أرغب|أحتاج)\s+(أن\s+)?/,'');return t.charAt(0).toUpperCase()+t.slice(1,60)};
const splitThoughts=t=>t.split(/\n|;|؛|\.\s+|(?=\bi\s+(?:want|wanna|need)\b)|(?=(?:^|\s)(?:أريد|أبغى|ابغى|أرغب)\s)/i).map(x=>x.trim().replace(/[.,،]+$/,'')).filter(x=>x.length>2);
function makeGoal(raw,i){
  const k=pbKey(raw),p=PB[k];
  return {id:'g'+Date.now().toString(36)+i,title:cleanTitle(raw),pb:k,cluster:p.cl,active:false,deps:[],since:Date.now(),touches:[],
    intake:null,steps:baseSteps(k)};
}
function linkDeps(){
  const money=S.goals.find(g=>g.pb==='money'),lap=S.goals.find(g=>g.pb==='laptop');
  S.goals.forEach(g=>{if(['car','laptop','house','marry','travel'].includes(g.pb)&&money&&g!==money)g.deps=[money.id];if(g.pb==='creator'&&lap)g.deps=[lap.id]});
}

/* ---------- state ---------- */
const fresh=()=>({v:4,app:VERSION,name:'',avatar:'spark',profile:{},onboarded:false,toured:false,base:0,calm0:6,answers:{},goals:[],days:[],badges:[],flags:{},msgs:[],todayDone:[],plan:null,dumps:[],released:0,log:[]});
let S=store.get(KEY);if(!S||!Array.isArray(S.goals))S=fresh();

const G=id=>S.goals.find(g=>g.id===id);
const L=()=>isAr()?2:1;
const gt=g=>g.title;
const fillT=(g,t)=>t.replace(/\{(\w+)\}/g,(m,k)=>{const p=PB[g.pb],v=g.intake&&g.intake.a&&g.intake.a[k],q=(p.q||[]).find(x=>x.id===k),o=q&&q.o.find(x=>x[0]===v);return o?o[L()]:((p.fb&&p.fb[k])||{})[lang]||''});
const gs=(g,i)=>{const x=g.steps[i];return x.t?x.t:fillT(g,PB[g.pb].steps[x.i][L()])};
const gmini=(g,i)=>{const t=g.steps[i].t?null:PB[g.pb].steps[g.steps[i].i][L()+2];return t?fillT(g,t):T('shrinkGeneric',gs(g,i))};
const gph=(g,i)=>{const p=PB[g.pb];if(g.steps[i].t)return '';return p.ph?p.ph[p.steps[g.steps[i].i][0]][lang]:''};
const gn=g=>(PB[g.pb].note||{})[lang]||'';
const stepsDone=g=>g.steps.filter(x=>x.done).length;
const fin=g=>!!g.intake&&g.steps.length>0&&g.steps.every(x=>x.done);
const prog=g=>g.steps.length?stepsDone(g)/g.steps.length:0;
const nextStep=g=>g.intake?g.steps.findIndex(x=>!x.done):-1;
const doneN=()=>S.goals.reduce((a,g)=>a+stepsDone(g),0);
const meanProg=()=>S.goals.length?S.goals.reduce((a,g)=>a+prog(g),0)/S.goals.length:0;
const globalOrder=()=>clamp(S.base+(1-S.base)*Math.pow(meanProg(),.72),0,1);
const RPL={on:false,t0:0,dur:7500,rf:1,days:7,c0:6,c1:6};
const nodeOrder=g=>{let o=clamp(.05+.95*(.85*globalOrder()+.15*prog(g)),0,1);if(RPL.on)o=.05+(o-.05)*RPL.rf;return o};
const calm=()=>Math.round(clamp(.04+.96*globalOrder(),0,1)*100);
const activeList=()=>S.goals.filter(g=>g.active&&!fin(g));
const markDay=()=>{const k=dayKey();if(!S.days.includes(k))S.days.push(k)};
function events(){const ev=[];S.goals.forEach(g=>{g.steps.forEach(x=>{if(x.at)ev.push({at:x.at,g:g.id})});(g.touches||[]).forEach(t=>ev.push({at:t,g:g.id}))});return ev}
const lastTouch=g=>Math.max(g.since||0,...events().filter(e=>e.g===g.id).map(e=>e.at));
const isShrunk=(g,i)=>g.active&&i>=0&&(Date.now()-lastTouch(g))/D>=((S.answers&&S.answers.pat===3)?2:3);

function insight(){
  if(!S.goals.length)return T('insEmpty');
  const open=S.goals.filter(g=>!fin(g));
  if(!open.length)return T('insDone');
  let best=null,bn=0;open.forEach(g=>{const n=open.filter(o=>o.deps.includes(g.id)).length;if(n>bn){bn=n;best=g}});
  if(best&&bn>=2)return T('insUnlock',gt(best),bn,best.active);
  const c=calm();return c<25?T('insEarly'):c<60?T('insMid'):T('insLate');
}
function patterns(){
  const ev=events();if(ev.length<4)return [];const out=[],now=Date.now();
  const byDay=Array(7).fill(0);ev.forEach(e=>byDay[new Date(e.at).getDay()]++);
  const bi=byDay.indexOf(Math.max(...byDay));out.push(T('patDay',dayName(bi),Math.round(byDay[bi]/ev.length*100)));
  const tb={morning:0,afternoon:0,evening:0,night:0};ev.forEach(e=>{const h=new Date(e.at).getHours();tb[h>=5&&h<12?'morning':h>=12&&h<18?'afternoon':h>=18&&h<23?'evening':'night']++});
  const tk=Object.keys(tb).sort((a,b)=>tb[b]-tb[a])[0];if(tb[tk]/ev.length>=.4)out.push(T('patTime',T('tm_'+tk)));
  const a=ev.filter(e=>e.at>now-7*D).length,b=ev.filter(e=>e.at<=now-7*D&&e.at>now-14*D).length;if(a||b)out.push(T('patWeek',a,b));
  return out;
}

const doneTodayIdx=g=>g.steps.map((x,k)=>k).filter(k=>g.steps[k].done&&g.steps[k].at&&dayKey(g.steps[k].at)===dayKey());
const doneToday=g=>doneTodayIdx(g).length;
const leftToday=g=>Math.max(0,QUOTA-doneToday(g));
const todayTasks=g=>{const out=[],n=leftToday(g);for(let k=0;k<g.steps.length&&out.length<n;k++)if(!g.steps[k].done)out.push(k);return out};
const untilReset=()=>{const n=new Date(),t=new Date(n);t.setHours(3,0,0,0);if(t<=n)t.setDate(t.getDate()+1);const m=Math.max(1,Math.round((t-n)/6e4));return Math.floor(m/60)+(isAr()?' س ':'h ')+(m%60)+(isAr()?' د':'m')};
const CHK='<span class="chk"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>';
/* ---------- v1.2.0: Today's 3 (total cap across all goals, with the reason shown) ---------- */
const TOTAL=3;
const doneTodayAll=()=>S.goals.reduce((a,g)=>a+doneToday(g),0);
const sIdx=(g,r)=>g.steps.findIndex(x=>r.u?x.u===r.u:(!x.u&&x.i===r.i));
const stepRef=(g,k)=>{const x=g.steps[k];return x.u?{g:g.id,u:x.u}:{g:g.id,i:x.i}};
const planSig=()=>activeList().map(g=>g.id+(g.intake?1:0)+g.steps.length).join('|');
function rankGoals(){
  const now=Date.now();
  return activeList().filter(g=>g.intake).map(g=>{
    const unl=S.goals.filter(o=>o.deps.includes(g.id)&&!fin(o)).length,stale=Math.floor((now-lastTouch(g))/D);
    return {g,s:unl*3+Math.min(stale,6)*.5+(prog(g)>=.5?1:0)}}).sort((a,b)=>b.s-a.s).map(x=>x.g);
}
function buildPlan(){
  const items=[];S.goals.forEach(g=>doneTodayIdx(g).forEach(k=>items.push(stepRef(g,k))));
  const gl=rankGoals(),qs=gl.map(g=>g.steps.map((x,k)=>k).filter(k=>!g.steps[k].done).slice(0,leftToday(g)));
  let more=true;
  while(items.length<TOTAL&&more){more=false;qs.forEach((q,gi)=>{if(items.length<TOTAL&&q.length){items.push(stepRef(gl[gi],q.shift()));more=true}})}
  S.plan={d:dayKey(),sig:planSig(),items};save();
}
function ensurePlan(){if(!S.plan||S.plan.d!==dayKey()||S.plan.sig!==planSig())buildPlan()}

let rec=null,listening=false;

/* ---------- v1.2.0: every thought gets one of three fates: goal, task for a goal, or let go ---------- */
const WORRY=/worr|anxious|anxiety|stress|scared|afraid|overthink|what if|annoy|angry|upset|sick of|can'?t stop thinking|why (?:am|do|did) i|قلق|خايف|خائف|خوف|متوتر|توتر|زعلان|مضايق|مزعج/i;
const TASKV=/^(?:(?:call|email|text|message|book|pay|send|order|renew|ask|check|find|schedule|cancel|fix|clean|print|sign|submit|reply|remind|pick up|follow up|look up|google)\b|(?:اتصل|كلم|ارسل|أرسل|احجز|ادفع|اطلب|جدد|اسأل|تحقق|ابحث|نظف|ذكر)(?=\s|$))/i;
const GOALV=/^(?:(?:i\s+)?(?:want|wanna|need|have)\s+to\b|(?:become|start|get|lose|buy|learn|build|launch|save|grow|publish)\b|(?:أريد|أبغى|ابغى|أرغب|اشتري|تعلم|ابدأ|انقص|ابني|اكسب)(?=\s|$))/i;
const STOPW=new Set(['want','wanna','need','with','have','that','this','from','about','your','more','some','make','take','into','what','your']);
const wordsOf=t=>noDia(String(t).toLowerCase()).split(/[^a-z0-9؀-ۿ]+/).filter(w=>w.length>3&&!STOPW.has(w));
const taskText=t=>{t=t.trim().replace(/[.,،]+$/,'');return t.charAt(0).toUpperCase()+t.slice(1,90)};
function bestGoal(t){
  const open=S.goals.filter(g=>!fin(g));if(!open.length)return null;
  const k=pbKey(t),w=wordsOf(t);let best=null,bs=0;
  open.forEach(g=>{let sc=0;if(!k.startsWith('gen_')&&g.pb===k)sc+=3;const gw=wordsOf(g.title);
    sc+=w.filter(x=>gw.some(y=>y===x||(x.length>4&&y.length>4&&(y.startsWith(x.slice(0,5))||x.startsWith(y.slice(0,5)))))).length*2;
    if(sc>bs){bs=sc;best={g,sc}}});
  return bs>=2?best:null;
}
function fateOf(raw){
  if(WORRY.test(raw))return {fate:'release'};
  const m=bestGoal(raw);
  if(m&&GOALV.test(raw)&&m.sc>=3)return {fate:'release',dup:true,gid:m.g.id};
  if(m&&(TASKV.test(raw)||!GOALV.test(raw)))return {fate:'task',gid:m.g.id};
  return {fate:'goal'};
}
let SORT=[];
function openSort(items){SORT=items.map(raw=>Object.assign({raw},fateOf(raw)));renderSort();openSheet('#sortSheet')}
function renderSort(){
  const open=S.goals.filter(g=>!fin(g)),sh=$('#sortSheet');
  sh.querySelectorAll(':scope>:not(.xbtn)').forEach(x=>x.remove());
  sh.insertAdjacentHTML('beforeend',`<div class="grab"></div><div class="tag">${T('sortTag')}</div><h2>${T('sortT')}</h2><p class="note">${T('sortHelp')}</p>`+
   SORT.map((x,k)=>{
     const g=x.gid&&G(x.gid);
     const to=x.fate==='task'?(g?`${T('toGoal')} <button class="lnk" data-cyc="${k}">${esc(gt(g))}</button>`:T('noGoalYet')):(x.fate==='release'&&x.dup?T('dupNote'):'');
     return `<div class="fr ${x.fate==='release'?'rel':''}"><div class="ft">${esc(taskText(x.raw))}</div>
      <div class="seg">${['goal','task','release'].map(f=>`<button data-k="${k}" data-f="${f}" class="${x.fate===f?'on':''}" ${f==='task'&&!open.length?'disabled':''}>${T('f'+f[0].toUpperCase()+f.slice(1))}</button>`).join('')}</div>
      <div class="to">${to}</div></div>`}).join('')+
   `<button class="btn" id="sortGo" style="margin-top:14px">${T('sortGo')}</button>`);
  sh.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{const x=SORT[+b.dataset.k],f=b.dataset.f;x.fate=f;
    if(f==='task'&&!(x.gid&&G(x.gid))){const m=bestGoal(x.raw);x.gid=(m?m.g:open[0]).id}renderSort()});
  sh.querySelectorAll('[data-cyc]').forEach(b=>b.onclick=()=>{const x=SORT[+b.dataset.cyc],at=open.findIndex(g=>g.id===x.gid);x.gid=open[(at+1)%open.length].id;renderSort()});
  $('#sortGo').onclick=applySort;
}
function applySort(){
  let ng=0,nt=0,nr=0;const now=Date.now();
  SORT.forEach((x,k)=>{
    if(x.fate==='task'&&G(x.gid)){const g=G(x.gid),at=g.steps.findIndex(y=>!y.done);
      g.steps.splice(at<0?g.steps.length:at,0,{i:-1,t:taskText(x.raw),done:false,u:'u'+now.toString(36)+k,c:now});nt++}
    else if(x.fate==='release')nr++;
    else{S.goals.push(makeGoal(x.raw,k));ng++}
    S.log.push({at:now,t:x.raw.slice(0,140),f:x.fate});
  });
  if(S.log.length>300)S.log=S.log.slice(-300);
  S.released+=nr;linkDeps();
  const dk=dayKey();if(!S.dumps.includes(dk))S.dumps.push(dk);markDay();
  S.flags.dumped=1;save();closeSheets();build();checkBadges();
  toast(T('sortedToast',ng,nt,nr));
  if(S.onboarded&&(ng||nt))setTimeout(()=>openToday(),900);
}

  if(listening&&rec)rec.stop();
  const items=splitThoughts($('#catchTxt').value);if(!items.length)return;

    h+=`<div class="pat" style="margin-bottom:18px">${patterns().map(x=>`<div>${x}</div>`).join('')}</div>`;
    av=activeList().map(g=>{const l=Math.max(0,...ev.filter(e=>e.g===g.id).map(e=>e.at));return {g,d:l?Math.floor((now-l)/D):null}}).filter(x=>x.d!==null&&x.d>=5).sort((a,b)=>b.d-a.d)[0]||null;
    if(av){const i=nextStep(av.g);h+=`<div class="move"><div class="txt" style="margin-bottom:10px">${esc(T('rvAvoid',gt(av.g),av.d))}</div>${i>=0?`<div class="two" style="font-size:14px;line-height:1.6;margin-bottom:14px">${esc(T('rvTry',gmini(av.g,i)))}</div>`:''}<div class="row"><button class="btn ghost" id="rvKeep">${T('rvKeep')}</button><button class="btn" id="rvPark">${T('rvPark')}</button></div></div>`}
    const open=S.goals.filter(g=>!fin(g));let best=null,bn=-1;open.forEach(g=>{const n=open.filter(o=>o.deps.includes(g.id)).length;if(n>bn){bn=n;best=g}});
    if(best)h+=`<p class="note">${esc(T('rvNext',gt(best)))}</p>`;
  }
  h+=`<button class="btn" id="rvClose">${T('close')}</button>`;
  $('#reviewSheet').innerHTML=h;
  const k=$('#rvKeep'),pk=$('#rvPark');if(k)k.onclick=closeSheets;if(pk)pk.onclick=()=>{parkGoal(av.g);openReview()};
  $('#rvClose').onclick=closeSheets;openSheet('#reviewSheet');
}

/* ---------- splash: dots gather into the brain, then the intro ---------- */
const SP={done:false,fast:null};
function runSplash(){
  const first=!S.onboarded,speed=first?1:1.6,cv=$('#pc'),reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  $('#spBrain').innerHTML=brainSVG(false);
  const lines=()=>[...document.querySelectorAll('#spIntro p')];
  const reveal=()=>{
    if(first){const ps=lines();ps.forEach((p,i)=>setTimeout(()=>p.classList.add('on'),i*1700));setTimeout(()=>$('#spBtn').classList.add('on'),ps.length*1700+400);
      SP.fast=()=>{ps.forEach(p=>p.classList.add('on'));$('#spBtn').classList.add('on')}}
    else{$('#spTitle').classList.add('on');$('#spBtn').classList.add('on')}
  };
  const show=()=>{SP.done=true;$('#spBrain').classList.add('on','float');cv.classList.add('off');
    if(first){lines().forEach(p=>p.classList.add('on'))}else $('#spTitle').classList.add('on');$('#spBtn').classList.add('on')};
  SP.skip=show;
  if(reduce){setTimeout(show,300);return}
  const dpr=Math.min(window.devicePixelRatio||1,2),cr=cv.getBoundingClientRect(),W=cr.width,H=cr.height;
  cv.width=W*dpr;cv.height=H*dpr;const cx=cv.getContext('2d');cx.scale(dpr,dpr);
  const br=$('#spBrain').getBoundingClientRect(),sc=br.width/200,ox=br.left-cr.left,oy=br.top-cr.top;
  const poly=brainOutline();
  const inside=(x,y)=>{let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])c=!c}return c};
  const N=window.innerWidth<500?260:340,tg=[];
  while(tg.length<N){const x=12+Math.random()*176,y=8+Math.random()*128;if(inside(x,y))tg.push([x,y])}
  for(let i=0;i<70;i++){const p=poly[Math.floor(i*poly.length/70)];tg.push([p[0],p[1]])}
  const cols=['#F2A0B5','#EC859F','#F9C2CE','#E7A0B4','#F5B3C3'],ink=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#111';
  const P=tg.map(([x,y],i)=>({tx:ox+x*sc,ty:oy+y*sc,sx:Math.random()*W,sy:Math.random()*H,d:Math.random()*1.9,du:2.3+Math.random()*1.3,r:.9+Math.random()*1.6,c:i%9===0?ink:cols[i%cols.length],al:i%9===0?.3:1,sw:(Math.random()-.5)*190,ph:Math.random()*9}));
  const t0=performance.now();let b1=0,b2=0,b3=0;
  (function step(now){
    const t=(now-t0)/1000*speed;cx.clearRect(0,0,W,H);
    for(const p of P){
      const e=clamp((t-p.d)/p.du,0,1),k=e<.5?4*e*e*e:1-Math.pow(-2*e+2,3)/2,sw=Math.sin(Math.PI*k)*p.sw;
      const x=lerp(p.sx,p.tx,k)+sw*.7+Math.sin(now/900+p.ph)*(1-k)*7,y=lerp(p.sy,p.ty,k)+sw*.35+Math.cos(now/1100+p.ph)*(1-k)*7;
      cx.globalAlpha=p.al*(.14+.8*Math.min(1,e*1.7));cx.fillStyle=p.c;cx.beginPath();cx.arc(x,y,p.r,0,6.283);cx.fill();
    }
    if(t>3.5&&!b1){b1=1;$('#spBrain').classList.add('on')}
    if(t>4.0&&!b2){b2=1;cv.classList.add('off')}
    if(t>5.0&&!b3){b3=1;SP.done=true;reveal();$('#spBrain').classList.add('float')}
    if(t<9)requestAnimationFrame(step);else cx.clearRect(0,0,W,H);
  })(t0);
}
$('#splash').addEventListener('click',()=>{if(!SP.done&&SP.skip)SP.skip();else if(SP.fast)SP.fast()});

  }else if(stp===4){
    const ai=new Set(aiRank().slice(0,3).map(x=>x.i));
    b.innerHTML=`<h1>${T('obFocusT')}</h1><p>${T('obFocusS')}</p>${OB.list.map((x,i)=>`<button class="opt ${OB.picks.includes(i)?'sel':''}" data-i="${i}">${esc(cleanTitle(x))}${ai.has(i)?`<small>${T('obAi')}</small>`:''}</button>`).join('')}`;
    next(T('next'),()=>createFromOb(),!OB.picks.length);
    b.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{const i=+o.dataset.i,at=OB.picks.indexOf(i);
      if(at>=0)OB.picks.splice(at,1);else{if(OB.picks.length>=3){toast(T('obMax'));return}OB.picks.push(i)}
      o.classList.toggle('sel',at<0);$('#obNext').disabled=!OB.picks.length});
  }else if(stp===5){
    if(keep&&S.onboarded){showResult();return}
    b.innerHTML=`<div class="bigres"><div class="brain">${brainSVG(false)}</div><h1 style="margin-top:20px">${T('obBuildT')}</h1></div>`;f.innerHTML='';
  }
}
function createFromOb(){
  S.name=OB.name;S.profile={birth:OB.birth,gender:OB.gender};S.answers={feel:OB.feel,pat:OB.pat};
  S.goals=OB.list.map((t,i)=>makeGoal(t,i));OB.picks.forEach(i=>{if(S.goals[i])S.goals[i].active=true});linkDeps();
  const FB={5:.40,4:.28,3:.16,2:.08,1:.02},pen=clamp((OB.list.length-3)*.012,0,.1);
  S.base=Math.max(0,(FB[OB.feel]||.16)-pen);S.onboarded=true;S.flags.dumped=1;S.dumps=[dayKey()];S.plan=null;S.calm0=calm();S.created=Date.now();save();checkBadges(true);
  obGo(5);setTimeout(showResult,2600);
}
function showResult(){
  const b=$('#obBody'),f=$('#obFoot'),c=S.calm0;
  b.style.opacity=0;
  setTimeout(()=>{
    b.innerHTML=`<div class="bigres"><div class="brain">${brainSVG(false)}</div><div class="num" id="obNum">0%</div><h1 style="font-size:22px;margin:6px 0 10px" id="obRes">${T('obResultT',c)}</h1><p>${T('obResultS')}</p></div>`;
    b.style.opacity=1;f.innerHTML=`<button class="btn" id="obNext">${T('obStart')}</button>`;$('#obNext').onclick=finishOb;
    const t0=performance.now();(function tick(n){const k=clamp((n-t0)/1700,0,1);$('#obNum').textContent=Math.round(c*ease(k))+'%';if(k<1)requestAnimationFrame(tick)})(t0);
  },450);
}
function finishOb(){
  const o=$('#onboard');o.classList.remove('on');build();paint();view('map');
  setTimeout(()=>{o.classList.remove('show');startTour()},1300);
}

/* ---------- guided tour ---------- */
const TOUR={i:0,on:false,iv:0};
const arect=e=>{const a=e.getBoundingClientRect(),p=$('#app').getBoundingClientRect();return {x:a.left-p.left,y:a.top-p.top,w:a.width,h:a.height}};
function tourRect(i){
  const pad=(r,p)=>({x:r.x-p,y:r.y-p,w:r.w+2*p,h:r.h+2*p});
  if(i===0&&nodes.length){const rs=nodes.map(n=>arect(n.dot));const x0=Math.min(...rs.map(r=>r.x)),y0=Math.min(...rs.map(r=>r.y)),x1=Math.max(...rs.map(r=>r.x+r.w)),y1=Math.max(...rs.map(r=>r.y+r.h));return {...pad({x:x0,y:y0,w:x1-x0,h:y1-y0},40),rad:'28px'}}
  if(i===1&&nodes.length){const n=nodes.find(n=>n.g.active)||nodes[0];return {...pad(arect(n.dot),26),rad:'50%'}}
  if(i===2)return {...pad(arect($('#meter')),12),rad:'16px'};
  if(i===3)return {...pad(arect($('#todayBtn')),6),rad:'28px'};
  if(i===4)return {...pad(arect($('#addBtn')),6),rad:'28px'};
  if(i===5)return {...pad(arect($('#profBtn')),6),rad:'50%'};
  const a=$('#app').getBoundingClientRect();return {x:a.width/2-1,y:a.height*.4,w:2,h:2,rad:'50%'};
}
function renderTour(){
  const i=TOUR.i,steps=T('tour'),cur=steps[i],r=tourRect(i),H=$('#app').getBoundingClientRect().height;
  const h=$('#hole');h.style.cssText=`left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;border-radius:${r.rad}`;
  const tc=$('#tcard'),low=(r.y+r.h/2)>H*.5;
  tc.innerHTML=`<h3>${cur.t}</h3><p>${cur.b}</p><div class="tfoot"><div class="dots">${steps.map((_,k)=>`<i class="${k<=i?'on':''}"></i>`).join('')}</div><div style="display:flex;gap:14px;align-items:center">${i<steps.length-1?`<button class="lnk" id="tSkip">${T('skip')}</button>`:''}<button class="btn" id="tNext">${i<steps.length-1?T('tourNext'):T('tourGo')}</button></div></div>`;
  tc.style.top=low?'86px':'auto';tc.style.bottom=low?'auto':'26px';
  $('#tNext').onclick=()=>{if(TOUR.i<steps.length-1){TOUR.i++;renderTour()}else endTour()};
  const sk=$('#tSkip');if(sk)sk.onclick=endTour;
  if(i===2)pulse();
  clearInterval(TOUR.iv);if(i<2)TOUR.iv=setInterval(()=>{const q=tourRect(TOUR.i),h2=$('#hole');h2.style.left=q.x+'px';h2.style.top=q.y+'px';h2.style.width=q.w+'px';h2.style.height=q.h+'px'},180);
}
function startTour(){TOUR.i=0;TOUR.on=true;$('#tour').classList.add('on');renderTour()}
function endTour(){TOUR.on=false;clearInterval(TOUR.iv);$('#tour').classList.remove('on');S.toured=true;save()}

/* ---------- boot ---------- */
applyLang();requestAnimationFrame(frame);
if(!S.onboarded&&!store.get('projectBrain.langSet'))showGate();else runSplash();
if(/[?&]demo/.test(location.search))window.__demo={
  progress(f){S.goals.forEach(g=>{if(!g.intake)applyIntake(g,'',Object.fromEntries((PB[g.pb].q||[]).map(q=>[q.id,q.o[0][0]])))});const all=[];S.goals.forEach(g=>g.steps.forEach((x,i)=>all.push([g,x,i])));const n=Math.round(all.length*f),now=Date.now(),ev=k=>{const d=new Date(now-k*D);d.setHours(20,10);return d.getTime()};
    all.forEach(([g,x],k)=>{x.done=k<n;if(x.done)x.at=ev((k*5)%8);else delete x.at});
    S.days=[0,1,2,3,4,5,6].map(k=>new Date(now-k*D).toLocaleDateString('en-CA'));S.flags=Object.assign(S.flags,{dumped:1,parked:1});save();checkBadges(true);paint()},
  age(id,days){const g=G(id);g.since=Date.now()-days*D;g.touches=[];g.steps.forEach(x=>{if(x.at)x.at=Math.min(x.at,Date.now()-days*D)});save()},
  open:openGoal,focus:focusGoal,today:openToday,view,theme:setTheme,profile:openProfile,review:openReview,replay:startReplay,endReplay,lang:setLang,tour:startTour,calm,state:()=>S};
</script>
